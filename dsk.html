<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ladang DSK - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a href="index.html" class="flex items-center">
                    Ladang DSK Report
                </a>
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <!-- Main container for the report -->
    <div class="container mx-auto p-4 md:p-8">
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content will be generated by JavaScript -->
        </div>
    </div>
    
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const estateData = {
                "id": "dsk",
                "name": "Ladang DSK",
                "reportInfo": "Based on Planting Advisory Report 2/2026 (Visit Date: 5 Aug 2026) & Agronomy Report 1/2026 (Visit Date: 30 Jan 2026).",
                "summaryMetrics": {
                    "area": {
                        "title": "Estate Area",
                        "lines": [
                            "Total Planted: 1,309.03 ha",
                            "Mature (Prime): 100%",
                            "Terrain: 48% Hilly, 37% Low-lying",
                            "Reclaiming: 8.00 ha (P16F)"
                        ]
                    },
                    "yield": {
                        "title": "Yield/Ha (MT)",
                        "type": "chart",
                        "canvasId": "miniYieldChart",
                        "note": "*2026 represents Jan-Jun only."
                    },
                    "cost": {
                        "title": "Ex-Estate Cost/MT (Jan-Jun 2026)",
                        "value": "RM 330.49 / RM 348.94",
                        "note": "5% favorable vs Budget (PAR Aug 2026)"
                    },
                    "manuring": {
                        "title": "Manuring Status (H1 2026)",
                        "value": "1,196.50 MT Applied",
                        "note": "Completed as scheduled (PAR Pg. 20)"
                    },
                     "pests": {
                        "title": "Pest Status",
                        "value": "Rats Controlled",
                        "note": "Rat baiting completed (PAR Pg. 21)"
                    }
                },
                "keyMetrics": [
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-blue-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M15 21a6 6 0 00-9-5.197m0 0A5.975 5.975 0 0112 13a5.975 5.975 0 01-3 5.197z' /></svg>", "label": "Labour Ratio", "value": "1:11 ha (Surplus)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-green-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path d='M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>", "label": "P&D Status", "value": "Controlled / Minimal" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z' /></svg>", "label": "OER % (Jan-Jun 2026)", "value": "19.40%" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path d='M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z' /></svg>", "label": "Harvester Prod.", "value": "<2.00 MT/md" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-purple-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path d='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>", "label": "Harvest Interval", "value": "12-15 days" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-teal-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path d='M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10' /></svg>", "label": "Manuring", "value": "100% On Schedule" }
                ],
                "chartData": {
                    "production": {
                        "labels": ["2021", "2022", "2023", "2024", "2025"],
                        "ffb": [15.83, 18.74, 15.24, 22.76, 24.45],
                        "rainfall": [1916.0, 2266.5, 2802.5, 2548.0, 2945.7],
                         "note": "Source: Agronomy Report Jan 2026, Pg. 38, 44 & PAR Aug 2026"
                    },
                    "ageProfile": {
                        "labels": ["Prime Mature Palms (2012-2016)"],
                        "data": [100],
                        "title": "Ladang DSK - Palm Age Distribution",
                        "note": "Source: PAR Aug 2026, Pg. 9"
                    }
                },
                "observations": [
                    "<b>Yield & Productivity:</b> YTD June 2026 yield recorded at 8.99 MT/ha, which is 8% below the to-date budget but palms show good bunch retention hinting at achieving the 23.15 MT/ha annual target. <span class='observation-ref'>(PAR Aug 2026, Pg. 32-33; AR Jan 2026, Pg. 38)</span>",
                    "<b>Pest Management (Rats & Elephants):</b> Rat damage spikes from late 2025 were addressed; a full round of baiting is completed across the estate with regular census in place. Elephant intrusions have reduced following boundary trenching and patrols. <span class='observation-ref'>(PAR Aug 2026, Pg. 21-23, 40; AR Jan 2026, Pg. 35)</span>",
                    "<b>Labour Efficiency & Mechanization:</b> Harvester productivity remains low at <2.0 MT/manday despite mechanization (3 Timacs, 7 crawlers). The estate has a surplus of 17 workers (Ratio 1:11), requiring immediate reallocation based on work demand. <span class='observation-ref'>(PAR Aug 2026, Pg. 12, 31, 34)</span>",
                    "<b>Drainage & Flood Management:</b> To combat flooding in low-lying Bungor/Rengam series soils (237.4 ha), 574 chains of drains were desilted. A 5-foot culvert washed out in P13C5 is proposed to be replaced with a concrete bridge. <span class='observation-ref'>(PAR Aug 2026, Pg. 24-25; AR Jan 2026, Pg. 45)</span>",
                    "<b>Land Reclamation:</b> 8.00 hectares of vacant, low-lying swampy area in Field P16F is actively being cleared to construct chambered bunds for new oil palm planting. <span class='observation-ref'>(PAR Aug 2026, Pg. 10, 39)</span>",
                    "<b>Cost Efficiency:</b> Estate demonstrated good cost management with Ex-Estate Production Cost at RM 330.49/MT (5% favorable) and Upkeep & Cultivation 25% under budget, though General Charges overspent due to early Quit Rent payment. <span class='observation-ref'>(PAR Aug 2026, Pg. 14, 36)</span>"
                ],
                "reports": {
                    "plantation": {
                        "Executive Summary": "The estate's performance over the last 6 months was satisfactory. Crop production (11,774.57 MT) is 8% below the to-date budget, but the cost of production (RM 330.49/MT) is 5% favorable. Management is urged to focus on resolving low-lying waterlogging, optimizing surplus labour reallocation, and improving harvester productivity. <span class='observation-ref'>(PA Report Aug 2026, Pg. 7, 36, 39)</span>",
                        "Area Statement": "As of June 2026, total planted area is 1,309.03 ha. This comprises:<br>• <b>Mature:</b> 1,309.03 ha (100% Prime).<br>• <b>Terrain:</b> 48% Hilly, 37% Low-lying, 15% Flat/Undulating.<br>• <b>Reclamation:</b> 8.00 ha of vacant low-lying area in Field P16F is being cleared for planting. <span class='observation-ref'>(PA Report Aug 2026, Pg. 9-10)</span>",
                        "Labour Statement": "Current workforce is 115 workers vs requirement of 98 (Ratio 1:11 ha).<br>• <b>Harvesters:</b> 73 workers (Ratio 1:18 ha).<br>• <b>Surplus:</b> The 17 surplus workers should be strictly allocated based on work demand to ensure competitive wages.<br>• <b>Contractors:</b> 3 contractors (89 workers) handle harvesting and transport. <span class='observation-ref'>(PA Report Aug 2026, Pg. 12-13)</span>",
                        "Staff Establishment": "The staff establishment is adequate with no staff movement since the last visit.<br>• <b>Key Personnel:</b> Manager (En. Mohd Afiq Bin Mansor), 1 Asst. Manager, 1 Chief Clerk, 1 Account Clerk, and 4 Supervisors. <span class='observation-ref'>(PA Report Aug 2026, Pg. 11)</span>",
                        "General Charges": "Total General Charges are <b>RM 1,002.50/ha</b>, which is 2% above the budget of RM 980.66/ha.<br>• <b>Overspending:</b> 'Quit Rent' (+100% due to early full payment), 'MSPO' (+88% for Bomba fire support), 'EPF & Exec Salaries' (Bonus incorrectly charged, to be reconciled).<br>• <b>Savings:</b> Offset by savings in other general administrative headers. <span class='observation-ref'>(PA Report Aug 2026, Pg. 14-16)</span>",
                        "Upkeep and Cultivation": "Total cost RM 1,057.00/ha (25% below budget).<br>• <b>Weeding:</b> Cost is RM 124.88/ha (14% below budget). Circle spraying satisfactory; soft grass retention improved.<br>• <b>Manuring:</b> Cost is RM 701.62/ha. First-half application completed (1,196.50 MT applied). EFB applied on terraces.<br>• <b>Pest & Disease:</b> Cost is RM 39.38/ha. Rat baiting round completed. Barn owl box occupancy at 87%. <span class='observation-ref'>(PA Report Aug 2026, Pg. 17-22)</span>",
                        "Harvesting and Collection": "YTD Cost is <b>RM 101.53/MT</b>, in line with the budget.<br>• <b>Interval:</b> Maintained at 12-15 days. Ripe crop quality is >95%.<br>• <b>Productivity:</b> Harvester productivity requires improvement (currently <2.0 MT/manday).<br>• <b>Mechanization:</b> Evacuation assisted by 3 Timacs (9.66 mt/day) and 7 Crawlers (10.14 mt/day). <span class='observation-ref'>(PA Report Aug 2026, Pg. 30-31, 34)</span>",
                        "Crop Production": "YTD (6 Months) FFB Production is <b>11,774.57 MT</b>, which is 8% below the budget of 12,800 MT. 2025 Full Year actual was 24.66 MT/ha.<br>• <b>Yield/Ha:</b> 8.99 MT/ha.<br>• <b>Extraction:</b> OER at 19.40%, Kernel at 4.76%.<br>• <b>Observation:</b> Field inspection indicates palms bear good bunch numbers, pointing toward meeting the annual budget of 23.15 MT/ha. <span class='observation-ref'>(PA Report Aug 2026, Pg. 32-33)</span>",
                        "Production Cost": "YTD Ex-Estate Cost of Production is <b>RM 330.49/MT</b>, which is 5% favorable compared to the budget of RM 348.94/MT.<br>• <b>General Charges:</b> RM 111.45/MT (+11% due to Quit Rent anomaly).<br>• <b>Upkeep:</b> RM 117.51/MT (-19% due to pending road/fertilizer payments).<br>• <b>Harvesting:</b> RM 101.53/MT (In line). <span class='observation-ref'>(PA Report Aug 2026, Pg. 36)</span>",
                        "Vehicles Running Cost": "Vehicle costs are generally satisfactory and below budget.<br>• <b>Hilux (CEF 9629):</b> RM 0.60/km.<br>• <b>Tractor (LDSK01):</b> RM 22.51/hr.<br>• <b>Van Higer:</b> RM 1.53/km. <span class='observation-ref'>(PA Report Aug 2026, Pg. 38)</span>",
                        "Capital Expenditure": "• <b>Labour Quarters:</b> 2 blocks x 4 units pending JTK approval.<br>• <b>Roofing:</b> Replacement for staff quarters and garage awarded in August.<br>• <b>Equipment:</b> Weighbridge computer and mattresses purchased slightly above budget. <span class='observation-ref'>(PA Report Aug 2026, Pg. 37)</span>",
                        "Immature": "Not Applicable (100% Mature Estate). <span class='observation-ref'>(PA Report Aug 2026, Pg. 9)</span>"
                    },
                    "agronomy": {
                        "Executive Summary": "Agronomy visit conducted 30 Jan 2026. Estate yield is encouraging. Prime aged palms (11-12 yrs) benefit from high bunch weight. Major agronomic focus is required on rat infestation exceeding thresholds and soil erodibility on Bungor/Rengam series. <span class='observation-ref'>(AR Jan 2026, Pg. 7, 38)</span>",
                        "Nutrient Inputs/Progress of Manuring": "2025 manuring program completed by Dec 2025 despite Mixture B delivery delays. Fertilizer placement improved in low-lying/terrace areas. For 2026, Mixture B and RP are the primary recommendations. <span class='observation-ref'>(AR Jan 2026, Pg. 11-13, 46)</span>",
                        "Agronomic Observation": "Harvesting interval ranges 10-20 days. Minimal crop losses in field. Pruning is 100% complete and satisfactory. Ground vegetation is sparse with exposed bare soil, indicating suboptimal development. Rat damage averaged 9.2% in Oct 2025, but spiked in P13C (16%). Elephant intrusions damage shoots in P15I2. <span class='observation-ref'>(AR Jan 2026, Pg. 16-37)</span>",
                        "Yield Performance": "Yield improved 7% vs 2024. Palms reaching peak production at 11-12 years. Soil analysis identifies Bungor series (45%) and Rengam series (21%) as dominant, both having low CEC and high erosion risk. <span class='observation-ref'>(AR Jan 2026, Pg. 39-41)</span>",
                        "Fertilizer Recommendation": "2026 Programme detailed in Appendix 1(a-c). RP applied at 1.5-2.0 kg/palm. Mixture B at 2.0-2.5 kg/palm. Minimize application schedule gaps. <span class='observation-ref'>(AR Jan 2026, Pg. 46-49)</span>"
                    },
                     "pinfosys": {
                        "summary": "Not Available."
                    }
                },
                "policy": " <div class='policy-item'><p class='font-semibold'>Pest Control (Rats)</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Rat-01:</b> Baiting is mandatory when fresh damage exceeds 10%. Implement systematic single-direction baiting. <span class='observation-ref'>(AR Jan 2026, Pg. 35)</span></p></div> <div class='policy-item'><p class='font-semibold'>Fertilizer Placement</p><p class='text-sm text-gray-600'><b>Policy Ref: FERT-APP-03:</b> Avoid broadcasting near drain edges or terrace lips. Plastic bowls preferred over containers to ensure even distribution. <span class='observation-ref'>(AR Jan 2026, Pg. 13)</span></p></div> <div class='policy-item'><p class='font-semibold'>Infrastructure Maintenance & Flooding</p><p class='text-sm text-gray-600'><b>Policy Ref: MAINT-ROAD-03:</b> Proper drainage and road maintenance are crucial for timely crop evacuation, especially in low-lying areas. Culverts unable to support water flow must be replaced with permanent structures. <span class='observation-ref'>(PAR Aug 2026, Pg. 25)</span></p></div>"
            };

            let chartInstances = {};
            const container = document.getElementById('selected-estate-container');

            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate();
                    populateInternalDropdowns();
                    attachEventListeners();
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Manuring') ? 'bg-purple-50 text-purple-800' : 'bg-red-50 text-red-800';
                    
                    if (metric.type === 'chart') {
                        return `<div class="p-4 rounded-lg ${colorClass} flex flex-col h-full shadow-sm border border-green-100">
                                    <h3 class="font-semibold">${metric.title}</h3>
                                    <div class="relative w-full flex-grow mt-2" style="min-height: 140px;">
                                        <canvas id="${metric.canvasId}"></canvas>
                                    </div>
                                    <p class="text-xs text-green-700 mt-2 text-center italic">${metric.note}</p>
                                </div>`;
                    }
                    if (metric.lines) {
                        return `<div class="p-4 rounded-lg ${colorClass} flex flex-col h-full shadow-sm"><h3 class="font-semibold mb-2">${metric.title}</h3><div class="flex-grow">${metric.lines.map(line => `<p class="text-sm mt-1">${line}</p>`).join('')}</div></div>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass} flex flex-col h-full shadow-sm"><h3 class="font-semibold">${metric.title}</h3><div class="flex-grow flex flex-col justify-center"><p class="text-3xl font-bold mt-2">${metric.value}</p></div><p class="text-xs opacity-75 mt-2">${metric.note}</p></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg">
                        <div class="bg-gray-100 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-sm text-gray-500">${metric.label}</p><p class="font-bold text-lg">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4">${obs}</li>`).join('');

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-1 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic">${estate.reportInfo}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">${summaryMetricsHTML}</div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-4 border-b pb-2">Key Metrics & Agronomic Status</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div></div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div><h3 class="text-xl font-semibold mb-2">5-Year Yield vs. Rainfall Trend</h3><div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.production.note}</p></div>
                            <div><h3 class="text-xl font-semibold mb-2">Palm Age Profile</h3><div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.ageProfile.note}</p></div>
                        </div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-2 border-b pb-2">Key Observations & Issues</h3><ul class="list-disc list-inside space-y-2 text-gray-700 mt-4">${observationsHTML}</ul></div>
                        <div class="mb-8 text-center"><button class="policy-modal-btn bg-green-800 text-white px-6 py-3 rounded-lg hover:bg-green-900 transition shadow-md">View Agricultural Policy Cross-Reference</button></div>
                        <div class="space-y-2">
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Plantation Advisory Report Details (Aug 2026)</button>
                            <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Agronomy Report Details (Jan 2026)</button>
                            <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Pinfosys Report Details</button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                Chart.register(ChartDataLabels);

                const prodCanvasId = `prodChart-${estateData.id}`;
                const ageCanvasId = `ageChart-${estateData.id}`;
                const miniYieldCanvasId = 'miniYieldChart';

                if (chartInstances[prodCanvasId]) chartInstances[prodCanvasId].destroy();
                if (chartInstances[ageCanvasId]) chartInstances[ageCanvasId].destroy();
                if (chartInstances[miniYieldCanvasId]) chartInstances[miniYieldCanvasId].destroy();

                const miniYieldCtx = document.getElementById(miniYieldCanvasId)?.getContext('2d');
                if (miniYieldCtx) {
                    chartInstances[miniYieldCanvasId] = new Chart(miniYieldCtx, {
                        type: 'bar',
                        data: {
                            labels: ['2024', '2025', '2026'],
                            datasets: [
                                {
                                    label: 'Actual',
                                    data: [22.76, 24.66, 8.99],
                                    backgroundColor: '#16a34a',
                                    borderRadius: 4
                                },
                                {
                                    label: 'Budget',
                                    data: [null, null, 9.78],
                                    backgroundColor: '#9ca3af',
                                    borderRadius: 4
                                }
                            ]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { 
                                legend: { display: true, position: 'bottom', labels: { boxWidth: 10, padding: 5, font: { size: 10 } } },
                                tooltip: {
                                    callbacks: {
                                        title: (context) => {
                                            if (context[0].label === '2026') return '2026 (Jan-Jun)';
                                            return context[0].label + ' (Full Year)';
                                        }
                                    }
                                },
                                datalabels: {
                                    anchor: 'end',
                                    align: 'top',
                                    formatter: Math.round,
                                    font: {
                                        weight: 'bold',
                                        size: 11
                                    },
                                    formatter: function(value, context) {
                                        if (value === null) return '';
                                        return value.toFixed(2);
                                    }
                                }
                            }, 
                            scales: { 
                                x: { grid: { display: false }, ticks: { font: { size: 10 } } }, 
                                y: { 
                                    display: false,
                                    suggestedMax: Math.max(22.76, 24.66, 9.78) * 1.25 // Added more padding for labels
                                } 
                            },
                            layout: { padding: { top: 25 } } // Added padding to canvas to prevent label cutoff
                        }
                    });
                }

                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx) {
                    chartInstances[prodCanvasId] = new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [
                                { label: 'FFB Yield (MT/Ha)', data: estateData.chartData.production.ffb, type: 'line', borderColor: '#ca8a04', backgroundColor: 'transparent', yAxisID: 'y-ffb', tension: 0.4 },
                                { label: 'Rainfall (mm)', data: estateData.chartData.production.rainfall, backgroundColor: '#3b82f6', yAxisID: 'y-rainfall' }
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, 'y-ffb': { type: 'linear', position: 'left', title: { display: true, text: 'FFB Yield (MT/Ha)' } }, 'y-rainfall': { type: 'linear', position: 'right', title: { display: true, text: 'Rainfall (mm)' }, grid: { drawOnChartArea: false } } } }
                    });
                }

                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx) {
                    chartInstances[ageCanvasId] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ data: estateData.chartData.ageProfile.data, backgroundColor: ['#16a34a', '#facc15', '#ef4444'], hoverOffset: 4 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: false }, legend: { position: 'bottom' } } }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const agronomyDiv = document.getElementById(`${estateData.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estateData.id}-plantation`);
                const pinfosysDiv = document.getElementById(`${estateData.id}-pinfosys`);
                
                if (agronomyDiv && estateData.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => `<h4 class="font-semibold mt-3 text-gray-800">${section}:</h4><p class="text-sm text-gray-600">${content}</p>`).join('');
                }

                if (plantationDiv && estateData.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => `<h4 class="font-semibold mt-3 text-gray-800">${section}:</h4><p class="text-sm text-gray-600">${content}</p>`).join('');
                }

                if (pinfosysDiv) {
                    pinfosysDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available.</p>`;
                }
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active');
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', () => openPolicyModal(estateData));
            }

            renderEstate();
        });
        
        function openPolicyModal(estate) {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            modalTitle.innerText = `Agricultural Policy Cross-Reference: ${estate.name}`;
            modalContent.innerHTML = estate.policy || "<p>No specific policies are cross-referenced for this report.</p>";
            document.getElementById('policyModal').classList.add('active');
        }

        function closePolicyModal() {
            document.getElementById('policyModal').classList.remove('active');
        }
    </script>
</body>
</html>
