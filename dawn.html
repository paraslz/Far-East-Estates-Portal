<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ladang Dawn - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a href="index.html" class="flex items-center">
                    Ladang Dawn Report
                </a>
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <!-- Main container for the report -->
    <div class="container mx-auto p-4 md:p-8">
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content generated by JavaScript -->
        </div>
    </div>
    
    <!-- Modal for displaying policy details -->
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow"></div>
        </div>
    </div>

                "observations": [
                    "<b>Rat Infestation & Baiting Progress:</b> Following high damage levels (>10%) in late 2025, 1 round of rat baiting at 100% density (STORM) was completed over 1,154.82 ha by July 2026, reducing fresh damage below the 10% threshold. However, targeted follow-up baiting is advised in sub-blocks with prolonged fresh and old damage (e.g., P21L). Barn owl box occupancy remains high at 98%. <span class='observation-ref'>(AR Pg. 47; PAR Pg. 5, 21-23)</span>",
                    "<b>2026 Manuring Delays & Application Quality:</b> As of July 2026, only 57% (1,254.90 MT of 2,188.60 MT) of the 2026 fertilizer program was applied due to 2nd-half delivery delays. Management must expedite the remaining 870 MT before the monsoon. Additionally, localized fertilizer lumping (P15D2) and Thick EFB heaping (P03C3) must be avoided; EFB (7,327.80 MT applied across 122.13 ha YTD) must be leveled in a single layer along frond-stacking rows. <span class='observation-ref'>(AR Pg. 4, 19, 23, 59; PAR Pg. 4, 19-20)</span>",
                    "<b>Pruning Progress vs. Canopy Care:</b> Progressive pruning was 100% completed across 1,338.72 ha, while normal pruning in tall palm blocks (P00A, P00B, P03C) reached 75% (319.25 ha out of 423.60 ha), leaving a 104 ha balance. Roadside over-pruning noted earlier in P16F2 and P12H3 must be avoided, especially in young mature and Ganoderma-infected areas. <span class='observation-ref'>(AR Pg. 5, 36-37; PAR Pg. 6, 29-30, 45)</span>",
                    "<b>Stand Density Deficit, Supplying & Thinning:</b> Young mature blocks P19J (138 SPH), P20K (134 SPH), and P21L (135 SPH) have lower stand density than optimal (148 SPH). In Jan-Jul 2026, 230 supply palms were planted in P19J, P20K, and P21L, alongside thinning of 167 sterile/runt palms in P12D and P19J (following 88 thinned in 2025). Supplying and wild seedling eradication (P21K) should be expedited. <span class='observation-ref'>(AR Pg. 10-11, 48; PAR Pg. 5, 24-25, 28, 44)</span>",
                    "<b>Ganoderma Management & Sanitation:</b> Ganoderma infestation remains below 5% in fields under 20 years old, but is elevated in 26-year-old sub-blocks P00A2 and P00A3 (scheduled for replanting in 2027). Deboling of severely infected and fallen palms in P00B and P03C is ongoing and must be expedited to curb disease spread. <span class='observation-ref'>(AR Pg. 4, 23; PAR Pg. 5, 23-24)</span>",
                    "<b>Harvesting Standards & Ripeness Control:</b> Harvesting intervals averaged 15 days (14 rounds in 7 months), though earlier agronomic observations noted 10-20 day inconsistencies, overripe bunches (up to 12% in P11E3/P16F3), and overnight heaps (P03C5). Strict enforcement of the 1 detached fresh loose fruit minimum standard is required to prevent harvesting unripe bunches. <span class='observation-ref'>(AR Pg. 25-29; PAR Pg. 6, 31-32)</span>",
                    "<b>Drain Desilting & Road Lateriting Delays:</b> Low-lying flood-prone areas cover 118.29 ha (6.75% of planted area). As of July 2026, only 73.50 chains (3.71%) of the 1,979.00-chain drain program were completed (RM 2.77/ha, 92% below budget), and 0 chains of the budgeted 280 chains of road lateriting were done. Desilting in flood-prone zones (P12H, P15D) and lateriting on soggy/inclined stretches must be completed before the October monsoon. <span class='observation-ref'>(AR Pg. 55; PAR Pg. 5, 25-27, 44)</span>"
                ],
                "reports": {
                    "plantation": {
                        "Executive Summary": "The estate's performance for the 7-month period (Jan-Jul 2026) is satisfactory. FFB production reached 22,653.78 MT (12.85 MT/ha), which is 3% above the YTD budget of 21,965.00 MT (12.46 MT/ha). Ex-estate cost of production stood at RM 237.01/MT, 17% below the YTD budget of RM 286.71/MT. Management is urged to expedite the remaining 43% of the 2026 fertilizer program, complete the 104 ha balance of normal pruning in tall palms, and finish drain desilting and road lateriting ahead of the monsoon. (PAR 2/2026, Pg. 4-7, 33, 36, 43-45)",
                        "Area Statement": "As of July 2026, total estate area is 1,841.01 ha, with 1,762.32 ha (95.73%) planted with mature oil palm (including 23.00 ha in Field P21G managed by Ladang Kg. Aur, now declared mature). <br>• <b>Mature:</b> 1,762.32 ha (65% young mature/prime, 34% old mature >20 yrs). <br>• <b>Immature:</b> 0 ha. <br>• <b>Others:</b> 78.69 ha (4.27%), comprising Central Nursery (25.50 ha), Unplantable (33.29 ha), Tapping Rights (12.10 ha), and Buildings (7.80 ha). <br>• <b>Replanting:</b> Field P00A (157.30 ha, planted 2000) is agreed for replanting in 2027. (PAR 2/2026, Pg. 4, 9-10)",
                        "Labour Statement": "Total workforce as of July 2026 is 164 workers (68 checkroll, 96 contract) against a requirement of 156 (+8 variance), giving an adequate ratio of 1:12 ha. <br>• <b>Harvesters:</b> 98 workers vs 86 required (+12 surplus; ratio 1:18 ha). Surplus harvesters are in training and deployed dynamically. <br>• <b>Upkeep & Others:</b> Driver/Loader 14 (req 13), Weeding 7 (req 8), Manuring 8 (req 5), Mandor 4 (req 9), Central Nursery 22 (req 25), General Workers 11 (req 10). <br>• <b>Turnover & Contractors:</b> In Jan-Jul 2026, 33 workers were recruited, 22 returned, 1 transferred in; 16 returned home, 26 on long leave, 9 absconded, 6 transferred out. Five contractors (Ayden Smart, Endri Maju, Usaha Kaffah, Ku Chin Hock, Navin) handle harvesting and internal transport. (PAR 2/2026, Pg. 12-13, 43)",
                        "Staff Establishment": "The staff establishment is satisfactory with 12 personnel, headed by Manager En. Muhammad Uzairi Bin Abdul Rahim (joined estate Mar 2025). Assistant Manager En. Muhammad Nabhan Dini and Executive En. Mohamad Afiq Syahmi were transferred in on 1st July 2026, joining Executives En. Nazmi Farhan and En. Kamarul Ariffin, 4 Field Conductors, 3 Clerks, and 1 Driver. (PAR 2/2026, Pg. 11)",
                        "General Charges": "YTD General Charges (Jan-Jul 2026) totaled RM 1,648,908.35 or RM 935.65/ha, which is 14% below the YTD budget of RM 1,093.41/ha (Annual budget: RM 1,874.38/ha). <br>• <b>Sub-headers:</b> Management & Supervision RM 327.39/ha (vs budget RM 430.85/ha), Labour & Amenities RM 309.40/ha (vs RM 324.82/ha), Others RM 298.85/ha (vs RM 337.74/ha). <br>• <b>Overspending (>5%):</b> Visiting & HO Charges (+17% at RM 17.24/ha due to Field Day for UMB, Prosper & Tehdara), Paid Leave/VLP (+34% at RM 61.32/ha due to higher ORP rate & headcount), Medical/VMO (+75% at RM 16.62/ha due to ORP sick pay), Upkeep Labour Quarters (+7% at RM 14.41/ha), Recruitment (+87% at RM 75.74/ha due to higher recruitment), Workmen Compensation (+111% at RM 1.46/ha), and MSPO (+28% at RM 9.89/ha for surveillance audit prep). (PAR 2/2026, Pg. 14-15, 47-48)",
                        "Upkeep and Cultivation": "YTD Upkeep & Cultivation cost is RM 2,059,081.00 or RM 1,168.39/ha, 17% below the YTD budget of RM 1,405.41/ha. <br>• <b>Weeding:</b> RM 111.64/ha (-21% vs budget RM 141.98/ha). Circle weeding covered 3,002.92 ha (vs 3,248.64 ha budget) and selective weeding covered 2,958.58 ha (vs 3,361.34 ha budget). Sprayer productivity averaged 5.50 ha/md (CDA, RM 82.50/day) and 4.50 ha/md (Mist blower, RM 72.00/day). Glyphosate restricted to 2m circle radius; sodium chlorate recommended for spot-spraying woodies/ferns. <br>• <b>Manuring:</b> RM 873.78/ha (-2% vs budget RM 894.55/ha). 57% completed (1,254.90 MT applied out of 2,188.60 MT annual requirement) due to 2nd-half delivery delays (870 MT pending). EFB mulching covered 122.13 ha (7,327.80 MT vs 22,000 MT annual budget). Worker productivity: 24-28 bags/day manual (RM 67.20/day) and 30-40 bags/day semi-mechanized (RM 72-80/day). <br>• <b>Pest & Disease:</b> RM 24.02/ha (-78% vs budget RM 106.95/ha). One round of STORM rat baiting completed across 1,154.82 ha (fresh damage now <10%). Barn owl occupancy is 98% (142/161 boxes occupied; 1:12 ha). Ganoderma is <5% in fields <20 yrs, higher in P00A2/A3; deboling ongoing in P00B & P03C. <br>• <b>Census, Thinning & Supplying:</b> Census & Thinning cost RM 4.43/ha (-50%). GPS palm census completed; 167 sterile/runt palms thinned in P12D & P19J. Supplying cost RM 3.32/ha (+178% vs RM 1.19/ha budget) with 230 palms supplied in P19J, P20K & P21L. <br>• <b>Drains, Roads & Boundaries:</b> Drains cost RM 2.77/ha (-92% vs RM 35.35/ha budget) with only 73.50 chains desilted out of 1,979.00 chains budgeted (3.71%). Roads & Bridges cost RM 73.91/ha (-37% vs RM 117.25/ha budget); 7,342.89 chains graded (7,085.45 ch field, 257.44 ch main), 0 chains laterited (vs 280 ch budget). Boundary cost RM 0.56/ha (-97%). <br>• <b>Pruning:</b> RM 73.97/ha (-11% vs RM 83.39/ha budget). Progressive pruning 100% done (1,338.72 ha); normal pruning in tall palms (P00A2/3/4, P00B, P03C1/2/3, P21G) is 75% done (319.25 ha of 423.60 ha), leaving a 104 ha balance. (PAR 2/2026, Pg. 16-30, 43-45)",
                        "Harvesting and Collection": "YTD Cost is RM 1,661,157.00 or RM 73.33/MT, 15% below the YTD budget of RM 86.23/MT (Harvesting Labour: RM 51.45/MT vs RM 60.45/MT budget; Internal Transport: RM 21.88/MT vs RM 25.78/MT budget). <br>• <b>Interval & Quality:</b> Maintained at 15 days (14 rounds in 7 months). Standards are acceptable, but strict adherence to the 1 detached fresh loose fruit minimum standard is advised to prevent unripe bunches. <br>• <b>Productivity & Mechanization:</b> Average harvester productivity is 2.41 MT/md with average earnings of RM 88.81/day. For mechanized collection, 6 Crawlers (covering 317.40 ha) averaged 10.35 MT/machine/day (2.05 MT/md), and 5 Timacs (covering 837.73 ha) averaged 14.15 MT/machine/day (2.58 MT/md). Extending Timac mechanization to young mature fields P19J, P20K & P21L is recommended. (PAR 2/2026, Pg. 31-32, 35)",
                        "Crop Production": "YTD (Jan-Jul 2026) FFB production is 22,653.78 MT (12.85 MT/ha), which is 3% above the YTD budget of 21,965.00 MT (12.46 MT/ha), though 8.4% lower than the same period in 2025 (24,733.42 MT; 14.22 MT/ha). Annual 2026 budget is 41,500.00 MT (23.55 MT/ha). <br>• <b>Field Performance:</b> Top-yielding blocks YTD are P00B (14.81 MT/ha), P03C (14.25 MT/ha), P00A (14.21 MT/ha), and P11E (13.72 MT/ha). Average estate ABW is 16.55 kg with 5.63 bunches/palm. <br>• <b>Extraction:</b> YTD CPO extraction (OER) is 19.81% (vs 18.95% budget; 4,487.12 MT CPO, 2.55 MT/ha) and Kernel extraction (KER) is 4.81% (vs 4.96% budget). (PAR 2/2026, Pg. 33-34)",
                        "Production Cost": "YTD Ex-Estate Cost of Production (Jan-Jul 2026) is RM 237.01/MT (Total: RM 5,369,146.35), which is 17% favorable compared to the YTD budget of RM 286.71/MT (Annual budget: RM 260.14/MT). <br>• <b>General Charges:</b> RM 72.79/MT (-17% vs budget RM 87.73/MT). <br>• <b>Upkeep & Cultivation:</b> RM 90.89/MT (-19% vs budget RM 112.76/MT). <br>• <b>Harvesting & Collection:</b> RM 73.33/MT (-15% vs budget RM 86.23/MT). (PAR 2/2026, Pg. 36)",
                        "Vehicles Running Cost": "Running costs were below budget across all units except the newly purchased Toyota Hilux CFD 6769 (acquired Aug 2025 to replace CEF 9629 transferred to Ladang DSK). <br>• <b>Toyota Hiace (CDP 8162):</b> RM 0.60/km actual vs RM 0.53/km budget (37,185 km run). <br>• <b>John Deere 70HP (JD 5715):</b> RM 13.38/hr actual vs RM 18.19/hr budget (926 hrs run). <br>• <b>Mini Tractor (L28000):</b> RM 3.08/hr actual vs RM 7.94/hr budget (1,352 hrs run). <br>• <b>Toyota Hilux 2.5V (CFD 6769):</b> RM 0.30/km actual vs RM 0.86/km budget (24,340 km run). Note: Table columns in report show actuals favorable overall, though text notes Hilux slightly higher; logbook verification is advised. (PAR 2/2026, Pg. 37)",
                        "Capital Expenditure": "No Capital Expenditure was budgeted for 2026. However, actual bookings of RM 1,972,638.75 were recorded under Plantation Cost - Biological Asset (Bearer Plant: RM 64,531.43 and RM 1,908,107.32). (PAR 2/2026, Pg. 38)",
                        "Immature & Central Nursery": "<b>Immature:</b> 0 ha (Field P21G - 23.00 ha declared mature in Jan 2026). <br><b>Central Nursery (25.50 ha):</b> Operates plastic pot trays in the pre-nursery (~3 months until 3-leaf stage) before main nursery transplanting. <br>• <b>Phase 7 (2025):</b> 184,367 seeds planted (Felda Yangambi ML161 & 3-Way); 1.90% ungerminated, 3.73% pre-nursery culled. 174,112 transplanted to main nursery; 10,631 culled (5.88%, total culling 9.61%), 39,377 sold to sister estates, 124,104 balance. Cost: RM 8.86/seedling. <br>• <b>Phase 8 (Jan-Jul 2026):</b> 129,318 seeds planted (Felda Yangambi, 3-Way & JPG Terras); 1.74% ungerminated, 3.03% culled. 63,132 transplanted to main nursery (0% culled to date), 60,091 balance in pre-nursery. Cost: RM 5.65/seedling. Upkeep and sanitation are satisfactory. (PAR 2/2026, Pg. 9-10, 39-42, 45)"
                    },
                    "agronomy": {
                        "Executive Summary": "The agronomic visit on 25th Feb 2026 assessed performance as satisfactory with yields reaching 28.04 MT/ha (28% above budget). However, yield-limiting factors include 99ha of pruning backlog in tall palms and significant rat infestations (>10%). Stand density in blocks P21L, P20K, and P19J (135-138 SPH) requires urgent supply planting as no work was carried out in 2025. (AR Pg. 4, 7, 10, 52)",
                        "Nutrient Inputs/Progress of Manuring": "The 2025 program was completed with delays ranging from 0-3 months (Mix B) to 1-3 months (Compound). Fertilizer application quality shows improvement but localized 'slight lumping' persists in P15D2. Store conditions are tidy, although investigation is needed for a wet floor condition. EFB application in 2025 covered 246.74 ha (14,804.56 MT), providing vital organic matter to Bungor soils. (AR Pg. 18-21)",
                        "Agronomic Observation": "<b>Harvesting:</b> Intervals were inconsistent (10-20 days). Overripe bunches (up to 12%) found in P11E3 and P16F3. Overnight bunch heaps noted in P03C5. <br><b>Pests:</b> Rat baiting was executed in Nov/Dec 2025; post-baiting census in Jan 2026 shows reduction (~8-10%) but systematic baiting should continue. Barn owl occupancy is excellent (98%). <br><b>Thinning:</b> 88 runt palms thinned in 2025 (P12D, P20K). <br><b>Pruning:</b> Roadside palms are over-pruned; hanging dry fronds localized in P11E4 and P12M. (AR Pg. 25-48)",
                        "Yield Performance": "Yield performance shows a strong upward trend from 20.68 (2023) to 28.04 (2025). 53% of the estate area is in the peak productive phase (8-19 years). 118.29 ha (6.75% of area) is flood-prone; desilting work covered 1,449.51 chains in 2025 to improve drainage. (AR Pg. 52-55)",
                        "Fertilizer Recommendation": "The 2026 program prioritizes Mix B and NK2 applications. Due to the high percentage of Bungor series soils (42.45%), frond-stacking and application near frond heaps are critical strategies to minimize nutrient leaching and surface runoff. (AR Pg. 59-63)"
                    },
                    "pinfosys": "Not Available"
                },
                "policy": " <div class='policy-item'><p class='font-semibold'>Pruning & Canopy Management</p><p class='text-sm text-gray-600'><b>Policy Ref: PRUNE-OLD-01:</b> Pruning backlogs in tall mature areas must be cleared to improve harvesting efficiency. Avoid over-pruning roadside palms and Ganoderma-infested blocks. (AR Pg. 36; PAR Pg. 29)</p></div> <div class='policy-item'><p class='font-semibold'>Pest Control (Rats & Ganoderma)</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Rat-02a:</b> Quarterly rat damage census must be conducted, and a systematic 100% baiting campaign initiated when damage exceeds 10%. (AR Pg. 47; PAR Pg. 5)</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Gano-01:</b> Palm mounding should be constructed once Ganoderma infection surpasses 5% in palms under 20 years old, and severely infected fallen palms must be deboled promptly. (PAR Pg. 5, 23)</p></div> <div class='policy-item'><p class='font-semibold'>Fertilizer & EFB Application</p><p class='text-sm text-gray-600'><b>Policy Ref: FERT-APP-01:</b> Ensure even broadcasting and complete manuring before the monsoon. Apply on frond heaps in Bungor soils to improve retention, and apply EFB in a single layer within 4 palms of the cut frond-stacking row. (AR Pg. 59; PAR Pg. 4, 19-20)</p></div> <div class='policy-item'><p class='font-semibold'>Weeding & Ground Cover</p><p class='text-sm text-gray-600'><b>Policy Ref: WEED-CIRC-02:</b> Confine Glyphosate circle spraying to a 2-metre radius around palm bases to prevent overspraying and retain soft grasses/Nephrolepis in the interrow. (PAR Pg. 4, 17, 43)</p></div>"
            };

            let chartInstances = {};
            const container = document.getElementById('selected-estate-container');

            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate();
                    populateInternalDropdowns();
                    attachEventListeners();
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Pruning') ? 'bg-red-50 text-red-800' : 'bg-yellow-50 text-yellow-800';
                    if (metric.lines) {
                        return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3>${metric.lines.map(line => `<p class="text-sm">${line}</p>`).join('')}</div>`;
                    }
                    if (metric.type === 'chart') {
                        return `
                            <div class="p-4 rounded-lg ${colorClass} flex flex-col justify-between">
                                <h3 class="font-semibold text-green-900 mb-1">${metric.title}</h3>
                                <div class="relative w-full h-28 my-1">
                                    <canvas id="${metric.canvasId}"></canvas>
                                </div>
                                <div class="flex justify-center items-center space-x-3 mt-1 text-xs text-gray-600">
                                    <span class="flex items-center"><span class="w-2.5 h-2.5 bg-[#16a34a] inline-block mr-1 rounded-sm"></span>Actual</span>
                                    <span class="flex items-center"><span class="w-2.5 h-2.5 bg-[#9ca3af] inline-block mr-1 rounded-sm"></span>Budget</span>
                                </div>
                                <p class="text-[11px] italic text-green-800 text-center mt-1">${metric.note}</p>
                            </div>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3><p class="text-2xl font-bold">${metric.value}</p><p class="text-xs text-gray-500 mt-1">${metric.note}</p></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg">
                        <div class="bg-gray-100 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-sm text-gray-500">${metric.label}</p><p class="font-bold text-lg">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4">${obs}</li>`).join('');

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-600 mb-6 italic border-l-4 border-green-800 pl-3">Visit Date: ${estate.visitDate} &bull; ${estate.reportInfo}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">${summaryMetricsHTML}</div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-4 border-b pb-2 text-green-900">Key Metrics & Agronomic Status</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div></div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div><h3 class="text-xl font-semibold mb-2">Monthly Production vs Rainfall (2025)</h3><div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.production.note}</p></div>
                            <div><h3 class="text-xl font-semibold mb-2">Palm Age Profile</h3><div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.ageProfile.note}</p></div>
                        </div>
                        <div class="mb-8 bg-gray-50 p-5 rounded-lg border border-gray-200"><h3 class="text-xl font-semibold mb-2 border-b border-gray-300 pb-2 text-red-900">Key Observations & Issues (PA & Agronomy)</h3><ul class="list-disc list-inside space-y-2 text-gray-700 mt-4">${observationsHTML}</ul></div>
                        <div class="mb-8 text-center"><button class="policy-modal-btn bg-green-800 text-white px-6 py-3 rounded-lg hover:bg-green-900 transition shadow-md font-semibold">Agricultural Policy Cross-Reference</button></div>
                        <div class="space-y-3">
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-md hover:bg-gray-700 transition flex justify-between items-center"><span class="font-bold">Plantation Advisory Report Details</span> <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg></button>
                            <div id="${estate.id}-plantation" class="details-content bg-white p-6 rounded-md border border-gray-200 shadow-inner"></div>
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-md hover:bg-gray-700 transition flex justify-between items-center"><span class="font-bold">Agronomy Report Details</span> <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg></button>
                            <div id="${estate.id}-agronomy" class="details-content bg-white p-6 rounded-md border border-gray-200 shadow-inner"></div>
                            <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-4 rounded-md hover:bg-gray-700 transition flex justify-between items-center"><span class="font-bold">Pinfosys Report Details</span> <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg></button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-white p-6 rounded-md border border-gray-200 shadow-inner"></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                const miniYieldCtx = document.getElementById('miniYieldChart')?.getContext('2d');
                if (miniYieldCtx) {
                    new Chart(miniYieldCtx, {
                        type: 'bar',
                        plugins: [ChartDataLabels],
                        data: {
                            labels: ['2024', '2025', '2026'],
                            datasets: [
                                {
                                    label: 'Actual',
                                    data: [23.86, 28.04, 12.85],
                                    backgroundColor: '#16a34a',
                                    borderRadius: 4,
                                    barPercentage: 0.7,
                                    categoryPercentage: 0.7
                                },
                                {
                                    label: 'Budget',
                                    data: [null, null, 12.46],
                                    backgroundColor: '#9ca3af',
                                    borderRadius: 4,
                                    barPercentage: 0.7,
                                    categoryPercentage: 0.7
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            layout: {
                                padding: { top: 20, bottom: 0, left: 5, right: 5 }
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: { enabled: true },
                                datalabels: {
                                    anchor: 'end',
                                    align: 'top',
                                    offset: 1,
                                    color: '#374151',
                                    font: { weight: 'bold', size: 11 },
                                    formatter: (value) => value !== null ? value.toFixed(2) : ''
                                }
                            },
                            scales: {
                                x: {
                                    grid: { display: false },
                                    ticks: { font: { size: 11 }, color: '#4b5563' }
                                },
                                y: {
                                    display: false,
                                    beginAtZero: true,
                                    max: 35
                                }
                            }
                        }
                    });
                }

                const prodCanvasId = `prodChart-${estateData.id}`;
                const ageCanvasId = `ageChart-${estateData.id}`;
                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx) {
                    new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [
                                { label: 'FFB (MT)', data: estateData.chartData.production.ffb, type: 'line', borderColor: '#ca8a04', backgroundColor: 'transparent', yAxisID: 'y-ffb', tension: 0.4 },
                                { label: 'Rainfall (mm)', data: estateData.chartData.production.rainfall, backgroundColor: '#3b82f6', yAxisID: 'y-rainfall' }
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, 'y-ffb': { type: 'linear', position: 'left', title: { display: true, text: 'FFB' } }, 'y-rainfall': { type: 'linear', position: 'right', title: { display: true, text: 'Rainfall (mm)' }, grid: { drawOnChartArea: false } } } }
                    });
                }

                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx) {
                    new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ data: estateData.chartData.ageProfile.data, backgroundColor: ['#22c55e', '#eab308', '#ca8a04', '#a16207', '#713f12'] }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const agronomyDiv = document.getElementById(`${estateData.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estateData.id}-plantation`);
                const pinfosysDiv = document.getElementById(`${estateData.id}-pinfosys`);
                
                if (agronomyDiv && estateData.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => `<div class="mb-4"><h4 class="font-bold text-gray-900 border-b pb-1 mb-2">${section}:</h4><div class="text-sm text-gray-600 leading-relaxed">${content}</div></div>`).join('');
                }
                if (plantationDiv && estateData.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => `<div class="mb-4"><h4 class="font-bold text-gray-900 border-b pb-1 mb-2">${section}:</h4><div class="text-sm text-gray-600 leading-relaxed">${content}</div></div>`).join('');
                }
                if (pinfosysDiv) {
                    pinfosysDiv.innerHTML = `<p class="text-sm text-gray-600 italic">Financial data from Pinfosys not available for this period.</p>`;
                }
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active');
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', openPolicyModal);
            }

            function openPolicyModal() {
                const modalTitle = document.getElementById('modalTitle');
                const modalContent = document.getElementById('modalContent');
                modalTitle.innerText = `Agricultural Policy Cross-Reference: ${estateData.name}`;
                modalContent.innerHTML = estateData.policy;
                document.getElementById('policyModal').classList.add('active');
            }

            window.closePolicyModal = function() {
                document.getElementById('policyModal').classList.remove('active');
            };

            renderEstate();
        });
    </script>
</body>
</html>
