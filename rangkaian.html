<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ladang Rangkaian - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a href="../index.html" class="flex items-center">
                    Ladang Rangkaian Report
                </a>
            </div>
            <a href="../estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <div class="container mx-auto p-4 md:p-8">
        <!-- Container where the estate data will be rendered -->
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content will be generated by JavaScript -->
        </div>
    </div>
    
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DATA STORE ---
            const estateData = {
                "id": "rangkaian",
                "name": "Ladang Rangkaian",
                "reportInfo": "Data based on PA Report (May 2026) & Agronomy Report (Nov 2025). Date of visit: 29th June 2026.",
                "summaryMetrics": {
                    "area": {
                        "title": "Estate Area",
                        "lines": [
                            "Total Planted: 1,392.50 ha",
                            "Mature: 1,392.50 ha (100%)",
                            "Peat Soil: 60% (Approx 835 ha)"
                        ]
                    },
                    "yield": {
                        "title": "Yield/Ha (Actual vs Budget)",
                        "value": "6.55 / 6.68 MT",
                        "note": "YTD May 2026 (In line with budget)"
                    },
                    "cost": {
                        "title": "FFB Cost/Tonne (Actual vs Budget)",
                        "value": "RM 313.90 / RM 364.15",
                        "note": "YTD May 2026 (14% Below Budget)"
                    },
                    "pest": {
                        "title": "Pest Status",
                        "value": "Severe Threat",
                        "note": "Elephants & Rats (Monitoring req.)"
                    },
                     "upkeep": {
                        "title": "Upkeep Status",
                        "value": "Mixed",
                        "note": "Weeding on schedule; Manuring delayed"
                    }
                },
                "keyMetrics": [
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-blue-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' /></svg>", "label": "Labour Ratio", "value": "1:14 ha (Short 10 Workers)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z' /></svg>", "label": "Elephant Threat", "value": "Reduced (4km Fencing installed)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z' /></svg>", "label": "OER % (YTD May '26)", "value": "19.03%" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z' /></svg>", "label": "Harvester Shortage", "value": "-6 Workers" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-purple-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2-2H5a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>", "label": "Harvest Interval", "value": "15 Days" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-teal-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17.657 18.343A8 8 0 016.343 7.029m11.314 11.314a8 8 0 01-11.314-11.314m2.121 13.435a2 2 0 01-2.828 0l-2.122-2.121a2 2 0 010-2.828l5.656-5.657a2 2 0 010 2.828l-5.657 5.657z' /></svg>", "label": "Nutrient Status", "value": "Manuring Delayed (43% H1)" }
                ],
                "chartData": {
                    "production": {
                        "labels": ["2022", "2023", "2024", "2025", "May 2026"],
                        "ffb": [19.49, 17.87, 18.67, 18.29, 6.55],
                        "rainfall": [5041, 6279, 4137, 4139.5, 809.5],
                        "note": "*2026 data is YTD May. Source: PA Report 1/2026, Pg. 35, 45"
                    },
                    "ageProfile": {
                        "labels": ["Prime Mature (12-14Y)"],
                        "data": [100],
                        "title": "Ladang Rangkaian - Palm Age Distribution",
                        "note": "*Source: PA Report 1/2026, Pg. 10."
                    }
                },
                "observations": [
                    "<b>Elephant Intrusion Mitigated:</b> Electric fencing (4km) has been installed along high-risk boundaries, significantly reducing the severity of attacks. However, an isolated intrusion still caused 15 palms to topple in P13D and P14E. <span class='observation-ref'>(PA Report 1/2026, Pg. 24; AR 2/2025, Pg. 35)</span>",
                    "<b>Rat Damage Persists:</b> Despite 100% completion of the first baiting round, fresh rat damage is still observed. Continuous monitoring and a systematic baiting strategy remain critical. Barn owl occupancy is high at 89%. <span class='observation-ref'>(PA Report 1/2026, Pg. 22; AR 2/2025, Pg. 38)</span>",
                    "<b>Drainage Improvements:</b> To address previous severe waterlogging and stunted palm growth, desilting of 428 chains of field drains in low-lying areas (e.g., P13C, P13D) has been completed, improving access and crop recovery. <span class='observation-ref'>(PA Report 1/2026, Pg. 26; AR 2/2025, Pg. 40)</span>",
                    "<b>Delayed Manuring Program:</b> H1 2026 fertilizer application is lagging at 43% completion due to late deliveries. Expediting this is crucial given the narrow application window in this high-rainfall region. <span class='observation-ref'>(PA Report 1/2026, Pg. 20; AR 2/2025, Pg. 10)</span>",
                    "<b>Labour & Productivity:</b> The estate faces a shortage of 10 workers overall and 6 harvesters (Ratio 1:25 ha). Despite this, harvester productivity is satisfactory at 1.74 MT/manday, keeping yield in line with budget. <span class='observation-ref'>(PA Report 1/2026, Pg. 13, 33)</span>",
                    "<b>Smallholder Intrusion:</b> Unauthorized intrusion by a smallholder was reported in Field P14G. Enhanced security, regular patrols, and prompt crop evacuation are mandated to prevent crop pilferage. <span class='observation-ref'>(PA Report 1/2026, Pg. 29)</span>"
                ],
                "reports": {
                    "plantation": {
                        "Executive Summary": "The estate's performance from January to May 2026 was satisfactory. FFB production (9,116.16 MT) is in line with the budget, and the cost of production (RM 313.90/MT) is 14% below budget. Management is urged to focus on mitigating pest risks (rats and elephants), expediting drainage works in low-lying areas, and catching up on the delayed manuring program. (PA Report 1/2026, Pg. 41-42)",
                        "Area Statement": "As of May 2026, the total planted area is 1,392.50 ha. This comprises:<br>• <b>Mature:</b> 1,392.50 ha (100%). Palms are at prime stages between 12 and 14 years old.<br>• <b>Immature:</b> 0 ha.<br>• <b>Replanting:</b> None planned.<br>• <b>Terrain:</b> 60% peatland, 40% mineral soil with cambered bunds constructed across 900 ha. (PA Report 1/2026, Pg. 10-11)",
                        "Labour Statement": "Current workforce is 97 workers vs requirement of 107 (Ratio 1:14 ha).<br>• <b>Harvesters:</b> 55 (Ratio 1:25 ha). Shortage of 6 harvesters.<br>• <b>Contractors:</b> Engaged for FFB harvesting, transport, and field upkeep (84 contract workers).<br>• <b>Turnover:</b> 5 recruited, 10 repatriated, 2 transferred, 3 absconded in the past 5 months. (PA Report 1/2026, Pg. 13-14)",
                        "Staff Establishment": "The staff establishment is adequate with 8 personnel, which includes 1 Manager (En. Mohd Khairul Nizam), 1 Assistant Manager, 3 Supervisors, 2 Clerks, and 1 Office Helper. (PA Report 1/2026, Pg. 12)",
                        "General Charges": "Total General Charges are RM 621.10/ha, which is 18% below the YTD budget of RM 758.14/ha.<br>• <b>Overspending:</b> 'Upkeep Labour Quarters' (+109% due to repairs and rental of mill quarters) and 'MSPO' (+28% due to purchase of signboards).<br>• <b>Savings:</b> Offset by lower management and supervision costs. (PA Report 1/2026, Pg. 15)",
                        "Upkeep and Cultivation": "YTD cost is RM 948.35/ha (18% below budget).<br>• <b>Weeding:</b> Circle spraying 2nd round in progress. Selective spraying 83% completed (delayed). Cost is RM 99.32/ha.<br>• <b>Manuring:</b> 43% complete by May (Delayed due to late delivery). Cost is RM 559.18/ha (24% below budget).<br>• <b>Pest & Disease:</b> Cost RM 42.08/ha (28% below budget). Barn Owl occupancy is 89% (92/103 boxes). Rat baiting 100% completed. (PA Report 1/2026, Pg. 16-25)",
                        "Harvesting and Collection": "YTD Cost is RM 74.16/MT, slightly lower (4%) than the budget of RM 77.03/MT.<br>• <b>Interval:</b> Averaged 15 days (10 rounds in 5 months).<br>• <b>Productivity:</b> 1.74 MT/manday (acceptable).<br>• <b>Mechanization:</b> 3 Timac units (12.84 MT/day) and 5 Ginga EV units (12.03 MT/day). (PA Report 1/2026, Pg. 32-34, 37)",
                        "Crop Production": "YTD (5 Months) FFB Production is 9,116.16 MT, which is in line with the budget of 9,300 MT.<br>• <b>Yield/Ha:</b> 6.55 MT/ha (5 months).<br>• <b>Extraction:</b> OER at 19.03% (CPO) and 4.75% (PK).<br>• <b>Comparison:</b> Slightly higher than 2025 same period (8,932.09 MT). (PA Report 1/2026, Pg. 35)",
                        "Production Cost": "YTD Ex-Estate Cost of Production is RM 313.90/MT, which is 14% favorable compared to the budget of RM 364.15/MT.<br>• <b>General Charges:</b> RM 94.87/MT (-16%).<br>• <b>Upkeep & Cultivation:</b> RM 144.86/MT (-17%).<br>• <b>Harvesting & Collection:</b> RM 74.16/MT (-4%). (PA Report 1/2026, Pg. 38)",
                        "Vehicles Running Cost": "Expenditure is generally under control. Toyota Hilux and Hiace running costs slightly higher due to increased diesel price. John Deere tractor (RM 10.40/hr) and Timac (RM 1.48/hr) running costs are below budget. (PA Report 1/2026, Pg. 40)",
                        "Capital Expenditure": "Total spent RM 345,784.10. Purchases of Toyota Hilux (RM 145,197.70), Toyota Hiace Van (RM 159,586.40), and Tipping Trailer (RM 20,500.00) completed below budgeted cost. (PA Report 1/2026, Pg. 39)",
                        "Immature": "N/A (100% Mature Estate). (PA Report 1/2026, Pg. 10)"
                    },
                    "agronomy": {
                        "Executive Summary": "Yield performance remains below expectations (14.76 MT/ha YTD Oct) despite prime palm age. Major limiting factors are extensive flooding in 31% of the estate, peat soil management issues (11.8%), and severe pest intrusions. The 2025 manuring program is nearing completion despite delays. (Source: AR 2/2025, Pg. 4-6)",
                        "Nutrient Inputs/Progress of Manuring": "Fertilizer application is 96% complete as of October 2025. Mixture B was delayed due to supplier issues in H1 2025 but has reached 94% completion. Kieserite and RP are 100% applied. EFB application is 48% complete; estate is advised to avoid EFB in flood-prone areas to prevent root waterlogging. (Source: AR 2/2025, Pg. 10-13)",
                        "Agronomic Observation": "<b>Harvesting:</b> Standard is generally acceptable, though some overripe bunches (5-8%) were noted. Loose fruit collection has improved. <br><b>Pruning:</b> Satisfactory on high ground but poor in low-lying areas. Over-pruning has reduced significantly. <br><b>Weeding:</b> Vegetation control is unacceptable in lower ground areas (overgrown interrows). Peat areas are dominated by Bracken Ferns; estate must promote <i>Nephrolepis</i> cover. (Source: AR 2/2025, Pg. 14, 25, 29, 31)",
                        "Pest & Disease Control": "<b>Elephants:</b> Damage has escalated from defoliation to palm toppling, particularly in hotspots (P14E, P13C, P13D). Logging in adjacent areas is a key driver. <br><b>Rats:</b> Damage >10% in multiple blocks (e.g., P14F, P13C). Current sporadic baiting is ineffective; a systematic single-direction strategy is required. <br><b>Barn Owls:</b> Box occupancy is excellent at 90%, but annual maintenance is lacking. (Source: AR 2/2025, Pg. 35-39)",
                        "Yield Performance & Constraints": "Yield depression is significant in flood-prone areas (12.91 MT/ha) compared to undulating areas (17.20 MT/ha). Waterlogging causes stunted palms and poor nutrient uptake. 2025 yield is trending lower than 2024. (Source: AR 2/2025, Pg. 40-41)",
                        "Fertilizer Recommendation (2026)": "The 2026 fertilizer program has been issued (Appendix 1a-1c). Key recommendations: <br>1. For new plantings/supply: 600g CRF + 500g RP in planting hole. <br>2. No manuring for blocks scheduled for replanting in 2026/2027. <br>3. Correct nutrient gaps (Low N, P, Mg) identified in foliar analysis. (Source: AR 2/2025, Pg. 28, 44)"
                    },
                    "pinfosys": {
                        "summary": "Not Available."
                    }
                },
                "policy": " <div class='policy-item'><p class='font-semibold'>Rat Control Strategy</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Rat-02:</b> Sporadic baiting is ineffective. A systematic, single-direction baiting strategy (South-to-North or West-to-East) must be implemented when damage >10%. (Ref: AR 2/2025, Pg. 38)</p></div> <div class='policy-item'><p class='font-semibold'>Elephant Control</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Elephant-01:</b> Integrated control required: Electric fencing voltage must be maintained, cables kept above floodwater, and night patrols equipped with noise deterrents implemented. (Ref: AR 2/2025, Pg. 36)</p></div> <div class='policy-item'><p class='font-semibold'>Weeding in Peat</p><p class='text-sm text-gray-600'><b>Policy Ref: WEED-PEAT-01:</b> Encourage soft ground cover like <i>Nephrolepis</i>. Selective spraying must target Bracken Ferns and woody growth only. (Ref: AR 2/2025, Pg. 31)</p></div>"
            };


            // --- GLOBAL VARIABLES ---
            let chartInstances = {};
            const container = document.getElementById('selected-estate-container');

            // --- STREAMING_CHUNK:Rendering HTML structure ---
            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate(estateData);
                    populateInternalDropdowns(estateData);
                    attachEventListeners(estateData);
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.values(estate.summaryMetrics).map(metric => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-800' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Pest') ? 'bg-red-50 text-red-800' : 'bg-yellow-50 text-yellow-800';
                    if (metric.lines) {
                        return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3>${metric.lines.map(line => `<p class="text-sm">${line}</p>`).join('')}</div>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3><p class="text-2xl font-bold">${metric.value}</p><p class="text-xs text-gray-500 mt-1">${metric.note}</p></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg">
                        <div class="bg-gray-100 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-sm text-gray-500">${metric.label}</p><p class="font-bold text-lg">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4">${obs}</li>`).join('');

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic">${estate.reportInfo}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">${summaryMetricsHTML}</div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-4 border-b pb-2">Key Metrics & Agronomic Status</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div></div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div><h3 class="text-xl font-semibold mb-2">Annual Yield & Rainfall</h3><div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.production.note}</p></div>
                            <div><h3 class="text-xl font-semibold mb-2">Palm Age Profile</h3><div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.ageProfile.note}</p></div>
                        </div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-2 border-b pb-2">Key Observations & Issues</h3><ul class="list-disc list-inside space-y-2 text-gray-700 mt-4">${observationsHTML}</ul></div>
                        <div class="mb-8 text-center"><button class="policy-modal-btn bg-green-800 text-white px-6 py-3 rounded-lg hover:bg-green-900 transition shadow-md">View Agricultural Policy Cross-Reference</button></div>
                        <div class="space-y-2">
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Plantation Advisory Report Details</button>
                            <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Agronomy Report Details</button>
                            <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                             <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Pinfosys Report Details</button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                        </div>
                    </div>`;
            }

            // --- STREAMING_CHUNK:Initializing charts via Chart.js ---
            function initializeChartsForEstate(estate) {
                const prodCanvasId = `prodChart-${estate.id}`;
                const ageCanvasId = `ageChart-${estate.id}`;
                if (chartInstances[prodCanvasId]) chartInstances[prodCanvasId].destroy();
                if (chartInstances[ageCanvasId]) chartInstances[ageCanvasId].destroy();

                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx) {
                    chartInstances[prodCanvasId] = new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estate.chartData.production.labels,
                            datasets: [
                                { label: 'FFB Yield (MT/Ha)', data: estate.chartData.production.ffb, type: 'line', borderColor: '#ca8a04', backgroundColor: 'transparent', yAxisID: 'y-ffb', tension: 0.4 },
                                { label: 'Rainfall (mm)', data: estate.chartData.production.rainfall, backgroundColor: '#3b82f6', yAxisID: 'y-rainfall' }
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, 'y-ffb': { type: 'linear', position: 'left', title: { display: true, text: 'FFB Yield (MT/Ha)' } }, 'y-rainfall': { type: 'linear', position: 'right', title: { display: true, text: 'Rainfall (mm)' }, grid: { drawOnChartArea: false } } } }
                    });
                }

                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx) {
                    chartInstances[ageCanvasId] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estate.chartData.ageProfile.labels,
                            datasets: [{ data: estate.chartData.ageProfile.data, backgroundColor: ['#16a34a'], hoverOffset: 4 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: estate.chartData.ageProfile.title, font: { size: 16 } }, legend: { position: 'right' } } }
                    });
                }
            }
            
            // --- STREAMING_CHUNK:Populating details and event listeners ---
            function populateInternalDropdowns(estate) {
                const agronomyDiv = document.getElementById(`${estate.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estate.id}-plantation`);
                const pinfosysDiv = document.getElementById(`${estate.id}-pinfosys`);

                if (agronomyDiv && estate.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estate.reports.agronomy).map(([section, content]) => `<h4 class="font-semibold mt-2 text-gray-800">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4><p class="text-sm text-gray-600 mt-1">${content}</p>`).join('');
                }
                if (plantationDiv && estate.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estate.reports.plantation).map(([section, content]) => `<h4 class="font-semibold mt-2 text-gray-800">${section.replace(/([A-Z])/g, ' $1').trim()}:</h4><p class="text-sm text-gray-600 mt-1">${content}</p>`).join('');
                }
                 if (pinfosysDiv && estate.reports.pinfosys) {
                    pinfosysDiv.innerHTML = `<p class="text-sm text-gray-600">${estate.reports.pinfosys.summary}</p>`;
                }
            }

            function attachEventListeners(estate) {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active');
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', () => openPolicyModal(estate));
            }

            renderEstate();
        });
        
        function openPolicyModal(estate) {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            modalTitle.innerText = `Agricultural Policy Cross-Reference: ${estate.name}`;
            modalContent.innerHTML = estate.policy;
            document.getElementById('policyModal').classList.add('active');
        }

        function closePolicyModal() {
            document.getElementById('policyModal').classList.remove('active');
        }
    </script>
</body>
</html>
