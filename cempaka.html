<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ladang Cempaka - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a href="index.html" class="flex items-center">
                    Ladang Cempaka Report
                </a>
            </div>
            <a href="estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <!-- Main container for the report -->
    <div class="container mx-auto p-4 md:p-8">
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content generated by JavaScript -->
        </div>
    </div>
    
    <!-- Modal for policy details -->
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow"></div>
        </div>
    </div>

    <script>
        // Global variable to store chart instances to allow destruction/re-initialization
        let chartInstances = {};

        document.addEventListener('DOMContentLoaded', () => {
            const estateData = {
                "id": "cempaka",
                "name": "Ladang Cempaka",
                "reportInfo": "Data based on PA Report 1/2026 (Visit: 18th Feb 2026) & Agronomy Report 2/2026 (Visit: 2nd Sep 2026).",
                "summaryMetrics": {
                    "area": {
                        "title": "Estate Area",
                        "lines": [
                            "Total Area: 494.33 ha",
                            "Mature (P18C): 167.64 ha",
                            "New Mature (P22B/D): 147.41 ha",
                            "Immature (P23A): 179.28 ha"
                        ]
                    },
                    "yield": {
                        "title": "Yield/Ha (MT)",
                        "isChart": true,
                        "chartData": {
                            "labels": ["2024", "2025", "2026"],
                            "actual": [22.71, 24.97, 9.36],
                            "budget": [null, null, 10.50] 
                        },
                        "note": "*2026 represents Jan-Jul only (AR Pg. 42)."
                    },
                    "cost": {
                        "title": "FFB Cost/Tonne (Ex-Estate)",
                        "value": "RM 245.49 / RM 315.89",
                        "note": "Full Year 2025 (PA 1/2026)"
                    },
                    "upkeep": {
                        "title": "Upkeep Status",
                        "value": "Behind Schedule",
                        "note": "Manuring delayed; VOPs require eradication"
                    },
                     "labour": {
                        "title": "Labour Deficit",
                        "value": "9 Workers",
                        "note": "Short 5 Harvesters (PA 1/2026)"
                    }
                },
                "keyMetrics": [
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-blue-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' /></svg>", "label": "Labour Ratio", "value": "1:18 ha (Deficit)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-red-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z' /></svg>", "label": "P&D Status", "value": "Rat Resurgence (>10%)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-yellow-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z' /></svg>", "label": "OER % (2025 Actual)", "value": "19.22% (Budget 19.00%)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-green-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>", "label": "Harvester Prod.", "value": ">2.0 MT/day" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-purple-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' /></svg>", "label": "Harvest Interval", "value": "14-17 Days (Acceptable)" },
                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-orange-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>", "label": "Nutrient Status", "value": "Delays (Stock Issues)" }
                ],
                "chartData": {
                    "production": {
                        "labels": ["Jan-26", "Feb-26", "Mar-26", "Apr-26", "May-26", "Jun-26", "Jul-26"],
                        "ffb": [289.96, 252.50, 219.24, 175.20, 207.30, 305.44, 508.52],
                        "rainfall": [41.50, 200.00, 54.00, 134.00, 300.50, 108.00, 98.00],
                        "note": "*Actual FFB production and rainfall YTD July 2026. (AR 2/2026, Appx 3 & 4)"
                    },
                    "ageProfile": {
                        "labels": ["Mature (P18C)", "New Mature (P22B)", "New Mature (P22D)", "Immature (P23A)"],
                        "data": [34, 21, 9, 36], 
                        "title": "Ladang Cempaka - Palm Age Distribution (2026)",
                        "note": "*Source: AR 2/2026, Pg. 7 Area Statement. Values in % of 494.33 ha."
                    }
                },
                "observations": [
                    "<b>Yield Drop in P18C:</b> Mature yield in P18C dropped 37% YTD (8.59 MT/ha), though bunch formation looks promising for H2. Conversely, P22B and P22D saw >110% yield increases compared to 2025. <span class='observation-ref'>(AR 2/2026, Pg. 34)</span>",
                    "<b>Rat Infestation Resurgence:</b> The August census showed fresh damage exceeding the 10% threshold across all monitored blocks. An immediate baiting campaign is required, despite a 96% barn owl box occupancy rate. <span class='observation-ref'>(AR 2/2026, Pg. 24-27)</span>",
                    "<b>Manuring Delays:</b> Stock and delivery issues caused delays in RP and Mixture B applications. Immature field P23A is currently at 0% completion for both Mix B and RP as of July. <span class='observation-ref'>(AR 2/2026, Pg. 9)</span>",
                    "<b>Over-Pruning & VOPs:</b> Over-pruning persists in P18C3 and immature P23A. Weed control is behind schedule with Volunteer Oil Palms (VOPs) and <i>Clidemia hirta</i> patches requiring immediate eradication. <span class='observation-ref'>(AR 2/2026, Pg. 16, 18, 28)</span>",
                    "<b>Critical Labour Deficit:</b> A workforce shortage of 9 personnel persists (25 actual vs 34 required). This includes a shortage of 5 harvesters, posing a risk to crop recovery. <span class='observation-ref'>(PA 1/2026, Pg. 4, 13)</span>",
                    "<b>Suspected Ganoderma Infestation:</b> An incidence of fallen palms suspected of Ganoderma infestation was previously reported in Field 18C. <span class='observation-ref'>(PA 1/2026, Pg. 21-22)</span>"
                ],
                "reports": {
                    "plantation": {
                        "Executive Summary": "The estate's performance for 2025 was satisfactory with FFB production 22% above budget and cost 22% below budget. Management is urged to recruit 5 additional harvesters as immature harvesting scales up in P23A. (PAR 1/2026, Pg. 8, 38)",
                        "Area Statement": "As of Jan 2026, total planted area is ~495 ha. Topography is predominantly flat to undulating. (PAR 1/2026, Pg. 10)",
                        "Labour Statement": "Current workforce is 25 workers vs requirement of 34 (Shortage: 9). Ratio: 1 worker per 18 ha. Additional workers are required to manage crop recovery and field maintenance. (PAR 1/2026, Pg. 4)",
                        "Production Cost": "2025 Ex-Estate cost: RM 245.49/MT (22% below budget of RM 315.89). Low production cost supported by high FFB volume. (PAR 1/2026, Pg. 29-30)",
                        "Immature Fields": "Field P23A (179.28 ha): Scout harvesting began Jan 2026. Density: 139/ha. (PAR 1/2026, Pg. 34-37)"
                    },
                    "agronomy": {
                        "Executive Summary": "Yield in mature block P18C dropped 37% YTD but shows promising bunch formation for H2. Fields P22B and P22D yields improved significantly. Key agronomic issues include delayed manuring due to stock issues, rat infestation resurgence (>10% damage), and persistent over-pruning in specific blocks. (AR 2/2026)",
                        "Nutrient Inputs & Manuring": "Overall mature manuring is 76% complete. Delays in Mixture B and RP application have occurred due to stock/delivery issues. Crucially, immature plantings (P23A) have received 0% of planned Mixture B and RP. Management must expedite deliveries to prevent >2 month delays. (AR 2/2026, Pg. 9, 37)",
                        "Agronomic Observation (Mature)": "Harvest interval is 14-17 days (acceptable). Canopy management is generally fair, though sub-block P18C3 showed insufficient frond retention. Inter-row weeding is behind schedule with VOPs and broadleaved weeds (Clidemia hirta) present. Foliar analysis indicated Mg deficiency in P22B/C requiring supplementary Kieserite. (AR 2/2026, Pg. 11-21)",
                        "Agronomic Observation (Immature)": "Palms in P23A show satisfactory vigor. However, over-pruning was observed; strict supervision is required to ensure a minimum of 3 supporting fronds are retained below the lowest bunch. Circle weeding is behind schedule. (AR 2/2026, Pg. 28-31)",
                        "Pest & Disease": "Rat damage resurged above the 10% threshold in August across all monitored blocks. Immediate baiting is required despite a high barn owl occupancy rate of 96% (44 out of 46 boxes). No fresh leaf-eating pest damage was observed. (AR 2/2026, Pg. 24-27, 32)",
                        "Yield Performance": "Mature field P18C dropped to 8.59 MT/ha YTD. New mature fields P22B (2.30 MT/ha) and P22D (2.11 MT/ha) showed >110% improvement. Immature P23A recorded 0.93 MT/ha, slightly below the 1.39 MT/ha estimate. (AR 2/2026, Pg. 34-36)"
                    },
                    "pinfosys": "Not Available"
                },
                "policy": " <div class='policy-item'><p class='font-semibold'>Pruning Standards</p><p class='text-sm text-gray-600'><b>Policy Ref: PRUNE-STD-01:</b> Over-pruning is strictly prohibited. Retain at least 2 subtending fronds below the lowest bunch in young mature palms, and 3 fronds in immature palms, to prevent physiological stress.</p></div> <div class='policy-item'><p class='font-semibold'>Labour Management</p><p class='text-sm text-gray-600'><b>Policy Ref: HR-MANPOWER-01:</b> Estate managers must maintain the budgeted worker-to-land ratio. Shortages exceeding 10% must be reported with an active recruitment plan.</p></div> <div class='policy-item'><p class='font-semibold'>Rat Infestation</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Rat-02b:</b> Quarterly rat censuses are mandatory. If damage >10%, baiting must be initiated within 30 days using approved rodenticides.</p></div>"
            };

            const container = document.getElementById('selected-estate-container');

            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate(estateData);
                    populateInternalDropdowns(estateData);
                    attachEventListeners(estateData);
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.entries(estate.summaryMetrics).map(([key, metric]) => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-900' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Upkeep') ? 'bg-red-50 text-red-800' : 'bg-yellow-50 text-yellow-800';
                    
                    if (metric.isChart) {
                        return `
                        <div class="p-4 rounded-xl ${colorClass} flex flex-col justify-between h-full min-h-[220px]">
                            <h3 class="font-bold text-lg mb-4">${metric.title}</h3>
                            <div class="flex-grow flex items-end justify-around space-x-2 px-2 relative pb-8 mt-2">
                                <!-- 2024 -->
                                <div class="flex flex-col items-center w-1/3">
                                    <span class="text-sm font-bold text-slate-700 mb-1">${metric.chartData.actual[0]}</span>
                                    <div class="w-8 bg-green-600 rounded-t-sm transition-all duration-500 ease-in-out" style="height: ${(metric.chartData.actual[0]/25)*100}px"></div>
                                    <span class="text-xs text-slate-500 mt-2 absolute bottom-2">2024</span>
                                </div>
                                <!-- 2025 -->
                                <div class="flex flex-col items-center w-1/3">
                                    <span class="text-sm font-bold text-slate-700 mb-1">${metric.chartData.actual[1]}</span>
                                    <div class="w-8 bg-green-600 rounded-t-sm transition-all duration-500 ease-in-out" style="height: ${(metric.chartData.actual[1]/25)*100}px"></div>
                                    <span class="text-xs text-slate-500 mt-2 absolute bottom-2">2025</span>
                                </div>
                                <!-- 2026 -->
                                <div class="flex flex-col items-center w-1/3 relative">
                                    <div class="flex space-x-1 items-end justify-center w-full">
                                         <div class="flex flex-col items-center">
                                            <span class="text-sm font-bold text-slate-700 mb-1">${metric.chartData.actual[2]}</span>
                                            <div class="w-6 bg-green-600 rounded-t-sm transition-all duration-500 ease-in-out" style="height: ${(metric.chartData.actual[2]/25)*100}px"></div>
                                         </div>
                                         <div class="flex flex-col items-center">
                                            <span class="text-sm font-bold text-slate-700 mb-1">${metric.chartData.budget[2].toFixed(2)}</span>
                                            <div class="w-6 bg-slate-400 rounded-t-sm transition-all duration-500 ease-in-out" style="height: ${(metric.chartData.budget[2]/25)*100}px"></div>
                                         </div>
                                    </div>
                                    <span class="text-xs text-slate-500 mt-2 absolute bottom-2">2026</span>
                                </div>
                            </div>
                            
                            <div class="flex justify-center items-center space-x-4 text-xs text-slate-600 mt-2">
                                <div class="flex items-center"><div class="w-3 h-3 rounded-full bg-green-600 mr-1"></div> Actual</div>
                                <div class="flex items-center"><div class="w-3 h-3 rounded-full bg-slate-400 mr-1"></div> Budget</div>
                            </div>
                            <p class="text-xs text-slate-500 italic text-center mt-3">${metric.note}</p>
                        </div>`;
                    }

                    if (metric.lines) {
                        return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3>${metric.lines.map(line => `<p class="text-sm">${line}</p>`).join('')}</div>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3><p class="text-2xl font-bold">${metric.value}</p><p class="text-xs text-gray-500 mt-1">${metric.note}</p></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg">
                        <div class="bg-gray-100 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-sm text-gray-500">${metric.label}</p><p class="font-bold text-lg">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4">${obs}</li>`).join('');

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic">${estate.reportInfo}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">${summaryMetricsHTML}</div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-4 border-b pb-2">Key Metrics & Agronomic Status</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div></div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div><h3 class="text-xl font-semibold mb-2">Monthly Production vs Rainfall (2026 YTD)</h3><div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.production.note}</p></div>
                            <div><h3 class="text-xl font-semibold mb-2">Palm Age Profile</h3><div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.ageProfile.note}</p></div>
                        </div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-2 border-b pb-2">Key Observations & Issues</h3><ul class="list-disc list-inside space-y-2 text-gray-700 mt-4">${observationsHTML}</ul></div>
                        <div class="mb-8 text-center"><button class="policy-modal-btn bg-green-800 text-white px-6 py-3 rounded-lg hover:bg-green-900 transition shadow-md">View Agricultural Policy Cross-Reference</button></div>
                        <div class="space-y-2">
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Agronomy Report 2/2026 Details</button>
                            <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Plantation Advisory Report 1/2026 Details</button>
                            <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Pinfosys Report Details</button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                const prodCanvasId = `prodChart-${estateData.id}`;
                const ageCanvasId = `ageChart-${estateData.id}`;
                
                // Cleanup existing charts if they exist
                if (chartInstances[prodCanvasId]) {
                    chartInstances[prodCanvasId].destroy();
                }
                if (chartInstances[ageCanvasId]) {
                    chartInstances[ageCanvasId].destroy();
                }

                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx) {
                    chartInstances[prodCanvasId] = new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [
                                { label: 'FFB Production (MT)', data: estateData.chartData.production.ffb, type: 'line', borderColor: '#ca8a04', backgroundColor: 'transparent', yAxisID: 'y-ffb', tension: 0.4 },
                                { label: 'Rainfall (mm)', data: estateData.chartData.production.rainfall, backgroundColor: '#3b82f6', yAxisID: 'y-rainfall' }
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false } }, 'y-ffb': { type: 'linear', position: 'left', title: { display: true, text: 'FFB Production (MT)' } }, 'y-rainfall': { type: 'linear', position: 'right', title: { display: true, text: 'Rainfall (mm)' }, grid: { drawOnChartArea: false } } } }
                    });
                }

                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx) {
                    chartInstances[ageCanvasId] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ data: estateData.chartData.ageProfile.data, backgroundColor: ['#ca8a04', '#fde047', '#facc15', '#fef08a'], hoverOffset: 4 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: estateData.chartData.ageProfile.title, font: { size: 16 } }, legend: { position: 'right' } } }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const agronomyDiv = document.getElementById(`${estateData.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estateData.id}-plantation`);
                const pinfosysDiv = document.getElementById(`${estateData.id}-pinfosys`);
                
                if (agronomyDiv && estateData.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => `<div class="mb-4"><h4 class="font-semibold text-gray-800">${section}</h4><p class="text-sm text-gray-600 mt-1 leading-relaxed">${content}</p></div>`).join('');
                } else if (agronomyDiv) {
                    agronomyDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }

                if (plantationDiv && estateData.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => `<div class="mb-4"><h4 class="font-semibold text-gray-800">${section}</h4><p class="text-sm text-gray-600 mt-1 leading-relaxed">${content}</p></div>`).join('');
                } else if (plantationDiv) {
                    plantationDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }

                if (pinfosysDiv && estateData.reports.pinfosys === "Not Available") {
                    pinfosysDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active');
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', openPolicyModal);
            }

            renderEstate();
        });
        
        function openPolicyModal() {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const policyData = ` <div class='policy-item'><p class='font-semibold'>Pruning Standards</p><p class='text-sm text-gray-600'><b>Policy Ref: PRUNE-STD-01:</b> Over-pruning is strictly prohibited. Retain at least 2 subtending fronds below the lowest bunch in young mature palms, and 3 fronds in immature palms, to prevent physiological stress.</p></div> <div class='policy-item'><p class='font-semibold'>Labour Management</p><p class='text-sm text-gray-600'><b>Policy Ref: HR-MANPOWER-01:</b> Estate managers must maintain the budgeted worker-to-land ratio. Shortages exceeding 10% must be reported with an active recruitment plan.</p></div> <div class='policy-item'><p class='font-semibold'>Rat Infestation</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Rat-02b:</b> Quarterly rat censuses are mandatory. If damage >10%, baiting must be initiated within 30 days using approved rodenticides.</p></div>`;
            modalTitle.innerText = 'Agricultural Policy Cross-Reference: Ladang Cempaka';
            modalContent.innerHTML = policyData;
            document.getElementById('policyModal').classList.add('active');
        }

        // Global function for the modal close button
        window.closePolicyModal = function() {
            document.getElementById('policyModal').classList.remove('active');
        };
    </script>
