<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ladang Cempaka - Plantation and Agronomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .details-content { display: none; }
        .details-content.active { display: block; }
        .dropdown-btn.active { background-color: #14532d; }
        .policy-item { border-left: 3px solid #16a34a; padding-left: 1rem; margin-top: 0.75rem; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: auto; }
        .pie-chart-container { position: relative; height: 350px; width: 100%; margin: auto; }
        .observation-ref { font-size: 0.75rem; color: #57534e; font-style: italic; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-xl font-bold text-gray-900">
                <a href="../index.html" class="flex items-center">
                    Ladang Cempaka Report
                </a>
            </div>
            <a href="../estates.html" class="text-green-800 hover:text-green-900 transition duration-300">&larr; Back to Estates List</a>
        </nav>
    </header>

    <!-- Main container for the report -->
    <div class="container mx-auto p-4 md:p-8">
        <div id="selected-estate-container" class="grid grid-cols-1 gap-8">
             <!-- Content generated by JavaScript -->
        </div>
    </div>
    
    <!-- Modal for policy details -->
    <div id="policyModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-2xl font-bold">Agricultural Policy Cross-Reference</h3>
                <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="modalContent" class="space-y-4 overflow-y-auto pr-4 flex-grow"></div>
        </div>
    </div>

    <script>
        // Register Chart.js DataLabels plugin
        Chart.register(ChartDataLabels);

        let chartInstances = {};

                    { "icon": "<svg xmlns='http://www.w3.org/2000/svg' class='h-6 w-6 text-green-600' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' /></svg>", "label": "Harvester Prod.", "value": "1.38 MT/md (P18C: 1.80)" },

                    },
                    "ageProfile": {
                        "labels": ["Mature P18C (33.80%)", "New Mature P22B (20.99%)", "New Mature P22D (8.74%)", "Immature P23A (36.15%)"],
                        "data": [33.80, 20.99, 8.74, 36.15],

                },
                "observations": [
                    "<b>Crop Production & Yield Variance:</b> YTD July 2026 FFB production (excluding Tapping Right P22D) reached 1,958.06 MT (7.21 MT/ha), 24% below budget (9.53 MT/ha) and 47% lower than the same period last year. Mature yield in P18C dropped 37% YTD (8.59 MT/ha) though bunch formation looks promising for H2, while P22B (4.09 MT/ha) and P22D (2.11 MT/ha) saw >110% yield increases over 2025. Lower yield in P22D is attributed to lower stands (122 SPH) and unproductive supplying palms. <span class='observation-ref'>(PA 2/2026, Pg. 31-32, 39; AR 2/2026, Pg. 34)</span>",
                    "<b>Manuring Program Delays:</b> Overall mature manuring is 64% to 76% complete as of July 2026 (258.65 MT applied out of 406.70 MT required), with delays in Mixture B and Rock Phosphate (RP) due to stock and supplier delivery issues. Crucially, immature field P23A has experienced delays in RP (2.00 kg/palm) and Mix B applications. Management must follow up closely with suppliers to expedite deliveries. <span class='observation-ref'>(PA 2/2026, Pg. 5, 20, 38; AR 2/2026, Pg. 9, 37)</span>",

                    "<b>Labour Force & Harvester Productivity:</b> Workforce has improved to 31 workers vs a requirement of 32 (1:16 ha ratio). Harvester strength is now sufficient at 18 workers (1:18 ha), but the estate remains slightly short of field maintenance workers (-1 weeding, -1 driver/loader). Average harvester productivity is 1.38 MT/man-day (1.80 MT/md in P18C; 0.76-0.91 MT/md in first-year fields P22B/P22D), requiring continued mechanisation expansion (Timac averaging 11.77 MT/day). <span class='observation-ref'>(PA 2/2026, Pg. 4, 13, 30, 33, 39)</span>",
                    "<b>Suspected Ganoderma & Unproductive Palms:</b> Fallen palms suspected of <i>Ganoderma</i> infection in P18C require prompt de-bolling and preventive sanitation measures. Ongoing thinning of sterile/runt palms and supplying in P22D and P23A must be expedited using PARAS GIS census data. <span class='observation-ref'>(PA 2/2026, Pg. 5, 23-24, 37, 40)</span>"
                ],
                "reports": {
                    "plantation": {
                        "Executive Summary": "The estate's performance as of July 2026 was acceptable. YTD FFB production is 1,958.06 MT (7.21 MT/ha), which is 24% lower than the budget and 47% lower than the same period last year. Ex-estate production cost is RM 397.07/MT (7% below the budget of RM 426.11/MT). Priority is needed to catch up on delayed manuring schedules, recruit additional upkeep workers, avoid circle overspraying, and expand mechanised in-field collection as harvesting areas grow. (PA Report 2/2026, Pg. 8, 31, 34, 39-41)",
                        "Area Statement": "As of July 2026, total estate area is 495.93 ha, with 494.33 ha planted (99.68%) and 1.60 ha of line site (0.32%).<br>• <b>Mature (315.05 ha / 63.53%):</b> Field P18C (167.64 ha, 140 SPH, Felda Yangambi), Field P22B (104.08 ha, 148 SPH, Chemara DxP, declared mature Jan 2026), and Field P22D Tapping Right (43.33 ha, 122 SPH, Chemara DxP, matured Jan 2026).<br>• <b>Immature (179.28 ha / 36.15%):</b> Field P23A (179.28 ha, 148 SPH). (PA Report 2/2026, Pg. 8, 10)",
                        "Labour Statement": "Current workforce is 31 workers (10 checkroll, 21 contract) vs requirement of 32 (Variance: -1; Ratio 1:16 ha), which is slightly low to support full field maintenance.<br>• <b>Harvesters:</b> 18 workers (2 checkroll, 16 contract) vs requirement of 18 (Ratio 1:18 ha). Sufficient for mature areas.<br>• <b>Upkeep & General:</b> Manuring: 5 (Req: 4, +1), Weeding: 3 contract (Req: 4, -1), Driver/Loader: 1 contract (Req: 2, -1), Mandor: 2 (Req: 2), General Worker: 2 (Req: 2).<br>• <b>Contractors:</b> Ayden Smart (20 workers for harvesting & weeding across 315.05 ha) and Alam Shag (1 worker for FFB transport).<br>• <b>Turnover (YTD):</b> 4 recruited, 7 returned, 1 transferred in; 2 repatriated, 3 on long leave, 1 transferred out. (PA Report 2/2026, Pg. 13-14)",

                        "Upkeep and Cultivation": "Total Upkeep & Cultivation expenditure YTD is RM 346,852.00 or RM 1,276.51/ha, which is 21% below the budget of RM 1,613.46/ha (RM 438,410.00).<br>• <b>Weeding:</b> RM 129.46/ha (28% below budget). Circle spraying: 426.46 ha done vs 777.51 ha budget (55%). Selective spraying: 462.46 ha done vs 630.10 ha budget (73%). Sprayer productivity is satisfactory at 5.00 ha/md (CDA, RM 80/day) and 4.50 ha/md (Mist blower, RM 72/day). Overspraying in P18C caused bare ground; circle spraying must be limited to a 2m radius. Spot-spray wild oil palm seedlings with sodium chlorate.<br>• <b>Manuring:</b> RM 979.91/ha (2% below budget of RM 996.54/ha). 64% completed (258.65 MT applied out of 406.70 MT annual program; 276.45 MT delivered). June RP is 58% complete; July Mix B (36.15 MT) delayed. Worker productivity is satisfactory at 24-30 bags/md (RM 72/day).<br>• <b>Pest & Disease:</b> RM 25.78/ha (79% below budget of RM 120.82/ha). 1 round of rat baiting (Storm Flocoumafen 0.005%, 1 pc/palm) completed across 315.05 ha. 42 Barn Owl boxes installed (1 box:11 ha) with 95% occupancy (39/42 boxes occupied). Fallen palms suspected of <i>Ganoderma</i> require de-bolling.<br>• <b>Census & Thinning:</b> RM 3.15/ha (51% below budget). PARAS GIS census completed; removal of sterile/runt palms in progress in P18C.<br>• <b>Drains:</b> RM 61.64/ha (in line with budget of RM 60.57/ha). 359.93 chains desilted out of 650.00 chains budgeted (55%) in P18C and P22B.<br>• <b>Roads & Bridges:</b> RM 29.86/ha (83% below budget of RM 174.69/ha). Grading conducted over 2,386 chains and 783 MT of crusher run applied.<br>• <b>Supplying & Boundaries:</b> Supplying cost RM 0.24/ha (expedite supplying in P22D). Boundaries & Survey cost RM 4.62/ha (73% below budget); regular patrols active along Felda Bera and Southern Keratong borders.<br>• <b>Pruning:</b> RM 41.86/ha (28% below budget of RM 58.35/ha). Progressive pruning satisfactory (retaining min 2 fronds below last bunch), but cut frond stacking needs improvement. (PA Report 2/2026, Pg. 17-28, 39-40)",
                        "Harvesting and Collection": "YTD Cost is RM 104.57/MT (RM 204,762.00), which is 20% below the budget of RM 131.32/MT (RM 340,116.00).<br>• <b>Breakdown:</b> Harvesting cost RM 75.11/MT (Budget RM 96.45/MT); Internal Transport RM 29.46/MT (Budget RM 34.86/MT).<br>• <b>Interval & Ripeness:</b> Average interval maintained at 15 days (14 rounds in 7 months). Enforce minimum ripeness standard of at least 1 detached loose fruit on the ground.<br>• <b>Harvester Productivity & Earnings:</b> Overall average is 1.38 MT/man-day across 1,487 man-days. By field: P18C at 1.80 MT/md (RM 97.20/day), P22B at 0.91 MT/md (RM 83.72/day), and P22D at 0.76 MT/md (RM 69.92/day).<br>• <b>Mechanisation:</b> 1 unit of Timac covering 7 harvesters achieved 11.77 MT/machine-day (1.74 MT/harvester-day). An additional Timac unit is recommended as harvesting areas expand. (PA Report 2/2026, Pg. 29-30, 33, 41)",
                        "Crop Production": "YTD (7 Months) FFB Production (excluding Tapping Right P22D) is 1,958.06 MT, which is 24% below the budget of 2,590.00 MT and 14% lower than last year's same period (2,285.14 MT). Including P22D (91.64 MT), total estate FFB harvested is 2,049.70 MT.<br>• <b>Yield/Ha:</b> 7.21 MT/ha excl. P22D (vs budget 9.53 MT/ha and 2025 YTD 13.63 MT/ha). Including P22D, overall mature yield is 6.50 MT/ha.<br>• <b>Field Breakdown:</b> P18C: 1,439.48 MT (8.59 MT/ha, ABW 11.23 kg, 5.46 bunches/palm); P22B: 518.58 MT (4.09 MT/ha, ABW 3.61 kg, 9.32 bunches/palm); P22D: 91.64 MT (2.11 MT/ha, ABW 3.71 kg, 4.67 bunches/palm).<br>• <b>Extraction Rate:</b> OER at 18.83% (Budget 18.80%, 368.76 MT CPO) and KER at 4.61% (Budget 5.02%, 90.23 MT PK). (PA Report 2/2026, Pg. 31-32)",
                        "Production Cost": "YTD Ex-Estate Cost of Production is RM 397.07/MT (RM 777,494.00), which is 7% favorable compared to the budget of RM 426.11/MT (RM 1,103,613.00).<br>• <b>General Charges:</b> RM 115.36/MT (-8% vs budget RM 125.52/MT).<br>• <b>Upkeep & Cultivation:</b> RM 177.14/MT (+5% vs budget RM 169.27/MT).<br>• <b>Harvesting & Collection:</b> RM 104.57/MT (-20% vs budget RM 131.32/MT). (PA Report 2/2026, Pg. 34)",
                        "Vehicles Running Cost": "Cummins Genset running costs were slightly higher than budget due to diesel price fluctuations, operating 16 hours/day for office and quarters.<br>• <b>Cummins Genset 82:</b> RM 14.40/hr actual vs RM 15.37/hr budget (1,750 hrs actual; RM 25,200.00 expenditure).<br>• <b>Cummins Genset 83:</b> RM 14.63/hr actual vs RM 14.40/hr budget (1,696 hrs actual; RM 24,812.36 expenditure).<br>• <b>Crawler LS360 (GC7203):</b> RM 2.86/hr (3,120 hrs, RM 8,934.00 expenditure), observed by the harvesting contractor. (PA Report 2/2026, Pg. 7, 35)",
                        "Capital Expenditure": "Total CAPEX YTD is RM 3,082,965.05.<br>• <b>Biological Asset (Bearer Plant):</b> RM 3,077,545.05.<br>• <b>Computer Equipment:</b> RM 5,420.00 for 1 unit HP Pro Computer purchased in June 2026 for office use (Unbudgeted). (PA Report 2/2026, Pg. 36)",
                        "Immature": "<b>Field P23A (179.28 ha):</b><br>• <b>Status & Stand:</b> Reached 30 months old in June 2026. Census density is 139 SPH (vs 148 SPH planted); 80 palms supplied YTD. Scout harvesting commenced in Jan 2026, yielding 166.20 MT FFB in 7 months.<br>• <b>Upkeep & Manuring:</b> 2 rounds of circle spraying and 3 rounds of selective spraying completed; avoid mist blowers to prevent spray drift onto inflorescences. 2 rounds of Comp 44 (1.50 kg/palm) completed, while RP application (2.00 kg/palm) is delayed.<br>• <b>P&D, Drains & Costs:</b> 1 round of <i>Oryctes</i> control completed using Carbosulfan 5% (15g/palm). 150 chains of main/collection drains desilted. Cost to maturity (excluding General Charges) is satisfactory at RM 10,955.19/ha. (PA Report 2/2026, Pg. 37-38)"
                    },
                    "agronomy": {
                        "Executive Summary": "Yield in mature block P18C dropped 37% YTD but shows promising bunch formation for H2. Fields P22B and P22D yields improved significantly. Key agronomic issues include delayed manuring due to stock issues, rat infestation resurgence (>10% damage), and persistent over-pruning in specific blocks. (AR 2/2026)",
                        "Nutrient Inputs & Manuring": "Overall mature manuring is 76% complete. Delays in Mixture B and RP application have occurred due to stock/delivery issues. Crucially, immature plantings (P23A) have received 0% of planned Mixture B and RP. Management must expedite deliveries to prevent >2 month delays. (AR 2/2026, Pg. 9, 37)",
                        "Agronomic Observation (Mature)": "Harvest interval is 14-17 days (acceptable). Canopy management is generally fair, though sub-block P18C3 showed insufficient frond retention. Inter-row weeding is behind schedule with VOPs and broadleaved weeds (Clidemia hirta) present. Foliar analysis indicated Mg deficiency in P22B/C requiring supplementary Kieserite. (AR 2/2026, Pg. 11-21)",
                        "Agronomic Observation (Immature)": "Palms in P23A show satisfactory vigor. However, over-pruning was observed; strict supervision is required to ensure a minimum of 3 supporting fronds are retained below the lowest bunch. Circle weeding is behind schedule. (AR 2/2026, Pg. 28-31)",
                        "Pest & Disease": "Rat damage resurged above the 10% threshold in August across all monitored blocks. Immediate baiting is required despite a high barn owl occupancy rate of 96% (44 out of 46 boxes). No fresh leaf-eating pest damage was observed. (AR 2/2026, Pg. 24-27, 32)",
                        "Yield Performance": "Mature field P18C dropped to 8.59 MT/ha YTD. New mature fields P22B (2.30 MT/ha) and P22D (2.11 MT/ha) showed >110% improvement. Immature P23A recorded 0.93 MT/ha, slightly below the 1.39 MT/ha estimate. (AR 2/2026, Pg. 34-36)"
                    },
                    "pinfosys": "Not Available"
                },
                "policy": " <div class='policy-item'><p class='font-semibold'>Pruning Standards</p><p class='text-sm text-gray-600'><b>Policy Ref: PRUNE-STD-01:</b> Over-pruning is strictly prohibited. Retain at least 2 subtending fronds below the lowest bunch in young mature palms, and 3 fronds in immature palms, to prevent physiological stress.</p></div> <div class='policy-item'><p class='font-semibold'>Weeding & Spraying</p><p class='text-sm text-gray-600'><b>Policy Ref: WEED-CIRC-02:</b> Circle spraying must be restricted to a 2-meter radius from the palm base. Mist blowers are prohibited in immature and young mature areas to prevent herbicide drift and inflorescence phytotoxicity.</p></div> <div class='policy-item'><p class='font-semibold'>Labour Management</p><p class='text-sm text-gray-600'><b>Policy Ref: HR-MANPOWER-01:</b> Estate managers must maintain the budgeted worker-to-land ratio. Shortages exceeding 10% must be reported with an active recruitment plan.</p></div> <div class='policy-item'><p class='font-semibold'>Rat Infestation & Ganoderma</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Rat-02b:</b> Quarterly rat censuses are mandatory. If damage >10%, baiting must be initiated within 30 days using approved rodenticides.</p><p class='text-sm text-gray-600'><b>Policy Ref: P&D-Gano-01:</b> Fallen palms suspected of Ganoderma infection must be promptly de-bolled and sanitized to prevent spread to neighbouring healthy palms.</p></div>"
            };

            const container = document.getElementById('selected-estate-container');

            function renderEstate() {
                container.innerHTML = createEstateHTML(estateData);
                setTimeout(() => {
                    initializeChartsForEstate(estateData);
                    populateInternalDropdowns(estateData);
                    attachEventListeners(estateData);
                }, 0);
            }

            function createEstateHTML(estate) {
                const summaryMetricsHTML = Object.entries(estate.summaryMetrics).map(([key, metric]) => {
                    const colorClass = metric.title.includes('Area') ? 'bg-blue-50 text-blue-800' : 
                                       metric.title.includes('Yield') ? 'bg-green-50 text-green-900' :
                                       metric.title.includes('Cost') ? 'bg-orange-50 text-orange-800' :
                                       metric.title.includes('Upkeep') ? 'bg-red-50 text-red-800' : 'bg-yellow-50 text-yellow-800';
                    
                    if (metric.type === 'chart') {
                        return `
                        <div class="p-4 rounded-xl border border-green-100 ${colorClass} flex flex-col justify-between h-full min-h-[220px]">
                            <h3 class="font-bold text-lg text-green-900 mb-1">${metric.title}</h3>
                            <div class="relative w-full flex-grow flex items-center justify-center" style="height: 135px;">
                                <canvas id="${metric.canvasId}"></canvas>
                            </div>
                            <div class="flex justify-center items-center space-x-4 text-xs text-gray-600 mt-1">
                                <div class="flex items-center"><span class="w-3 h-3 bg-[#16a34a] inline-block mr-1.5 rounded-sm"></span>Actual</div>
                                <div class="flex items-center"><span class="w-3 h-3 bg-[#9ca3af] inline-block mr-1.5 rounded-sm"></span>Budget</div>
                            </div>
                            <p class="text-xs text-green-800 italic text-center mt-2">${metric.note}</p>
                        </div>`;
                    }

                    if (metric.lines) {
                        return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3>${metric.lines.map(line => `<p class="text-sm">${line}</p>`).join('')}</div>`;
                    }
                    return `<div class="p-4 rounded-lg ${colorClass}"><h3 class="font-semibold">${metric.title}</h3><p class="text-2xl font-bold">${metric.value}</p><p class="text-xs text-gray-500 mt-1">${metric.note}</p></div>`;
                }).join('');

                const keyMetricsHTML = estate.keyMetrics.map(metric => `
                    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg">
                        <div class="bg-gray-100 p-2 rounded-full">${metric.icon}</div>
                        <div><p class="text-sm text-gray-500">${metric.label}</p><p class="font-bold text-lg">${metric.value}</p></div>
                    </div>`).join('');

                const observationsHTML = estate.observations.map(obs => `<li class="ml-4">${obs}</li>`).join('');

                return `
                    <div class="bg-white p-6 rounded-lg shadow-lg animate-fade-in">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">${estate.name}</h2>
                        <p class="text-sm text-gray-500 mb-6 italic">${estate.reportInfo}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">${summaryMetricsHTML}</div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-4 border-b pb-2">Key Metrics & Agronomic Status</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">${keyMetricsHTML}</div></div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div><h3 class="text-xl font-semibold mb-2">Monthly Production vs Rainfall (2026 YTD)</h3><div class="chart-container"><canvas id="prodChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.production.note}</p></div>
                            <div><h3 class="text-xl font-semibold mb-2">Palm Age Profile</h3><div class="pie-chart-container"><canvas id="ageChart-${estate.id}"></canvas></div><p class="text-xs text-center text-gray-500 mt-2">${estate.chartData.ageProfile.note}</p></div>
                        </div>
                        <div class="mb-8"><h3 class="text-xl font-semibold mb-2 border-b pb-2">Key Observations & Issues</h3><ul class="list-disc list-inside space-y-2 text-gray-700 mt-4">${observationsHTML}</ul></div>
                        <div class="mb-8 text-center"><button class="policy-modal-btn bg-green-800 text-white px-6 py-3 rounded-lg hover:bg-green-900 transition shadow-md">View Agricultural Policy Cross-Reference</button></div>
                        <div class="space-y-2">
                            <button data-dropdown-id="${estate.id}-plantation" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Plantation Advisory Report Details</button>
                            <div id="${estate.id}-plantation" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-agronomy" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Agronomy Report Details</button>
                            <div id="${estate.id}-agronomy" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                            <button data-dropdown-id="${estate.id}-pinfosys" class="dropdown-btn w-full text-left bg-gray-800 text-white p-3 rounded-md hover:bg-gray-700 transition">Pinfosys Report Details</button>
                            <div id="${estate.id}-pinfosys" class="details-content bg-gray-50 p-4 rounded-md border border-gray-200"></div>
                        </div>
                    </div>`;
            }

            function initializeChartsForEstate() {
                const miniYieldCanvasId = estateData.summaryMetrics.yield.canvasId;
                const prodCanvasId = `prodChart-${estateData.id}`;
                const ageCanvasId = `ageChart-${estateData.id}`;
                
                // Cleanup existing charts if they exist
                if (chartInstances[miniYieldCanvasId]) {
                    chartInstances[miniYieldCanvasId].destroy();
                }
                if (chartInstances[prodCanvasId]) {
                    chartInstances[prodCanvasId].destroy();
                }
                if (chartInstances[ageCanvasId]) {
                    chartInstances[ageCanvasId].destroy();
                }

                // Mini Yield Bar Chart with ChartDataLabels
                const miniYieldCtx = document.getElementById(miniYieldCanvasId)?.getContext('2d');
                if (miniYieldCtx) {
                    const yData = estateData.summaryMetrics.yield.chartData;
                    chartInstances[miniYieldCanvasId] = new Chart(miniYieldCtx, {
                        type: 'bar',
                        data: {
                            labels: yData.labels,
                            datasets: [
                                {
                                    label: 'Actual',
                                    data: yData.actual,
                                    backgroundColor: '#16a34a',
                                    borderRadius: 4,
                                    barPercentage: 0.75,
                                    categoryPercentage: 0.75
                                },
                                {
                                    label: 'Budget',
                                    data: yData.budget,
                                    backgroundColor: '#9ca3af',
                                    borderRadius: 4,
                                    barPercentage: 0.75,
                                    categoryPercentage: 0.75
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            layout: {
                                padding: { top: 22, bottom: 0, left: 4, right: 4 }
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: { enabled: true },
                                datalabels: {
                                    anchor: 'end',
                                    align: 'top',
                                    offset: 2,
                                    color: '#374151',
                                    font: { weight: 'bold', size: 11 },
                                    formatter: (value) => value !== null ? value.toFixed(2) : ''
                                }
                            },
                            scales: {
                                x: {
                                    grid: { display: false },
                                    border: { display: true, color: '#d1d5db' },
                                    ticks: { color: '#4b5563', font: { size: 11 } }
                                },
                                y: {
                                    display: false,
                                    beginAtZero: true,
                                    suggestedMax: 32
                                }
                            }
                        }
                    });
                }

                const prodCtx = document.getElementById(prodCanvasId)?.getContext('2d');
                if(prodCtx) {
                    chartInstances[prodCanvasId] = new Chart(prodCtx, {
                        type: 'bar',
                        data: {
                            labels: estateData.chartData.production.labels,
                            datasets: [
                                { label: 'FFB Production (MT)', data: estateData.chartData.production.ffb, type: 'line', borderColor: '#ca8a04', backgroundColor: 'transparent', yAxisID: 'y-ffb', tension: 0.4 },
                                { label: 'Rainfall (mm)', data: estateData.chartData.production.rainfall, backgroundColor: '#3b82f6', yAxisID: 'y-rainfall' }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                datalabels: { display: false }
                            },
                            scales: {
                                x: { grid: { display: false } },
                                'y-ffb': { type: 'linear', position: 'left', title: { display: true, text: 'FFB Production (MT)' } },
                                'y-rainfall': { type: 'linear', position: 'right', title: { display: true, text: 'Rainfall (mm)' }, grid: { drawOnChartArea: false } }
                            }
                        }
                    });
                }

                const ageCtx = document.getElementById(ageCanvasId)?.getContext('2d');
                if(ageCtx) {
                    chartInstances[ageCanvasId] = new Chart(ageCtx, {
                        type: 'pie',
                        data: {
                            labels: estateData.chartData.ageProfile.labels,
                            datasets: [{ data: estateData.chartData.ageProfile.data, backgroundColor: ['#ca8a04', '#fde047', '#facc15', '#fef08a'], hoverOffset: 4 }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                datalabels: { display: false },
                                title: { display: true, text: estateData.chartData.ageProfile.title, font: { size: 16 } },
                                legend: { position: 'right' }
                            }
                        }
                    });
                }
            }
            
            function populateInternalDropdowns() {
                const agronomyDiv = document.getElementById(`${estateData.id}-agronomy`);
                const plantationDiv = document.getElementById(`${estateData.id}-plantation`);
                const pinfosysDiv = document.getElementById(`${estateData.id}-pinfosys`);
                
                if (agronomyDiv && estateData.reports.agronomy) {
                    agronomyDiv.innerHTML = Object.entries(estateData.reports.agronomy).map(([section, content]) => `<div class="mb-4"><h4 class="font-semibold text-gray-800">${section}:</h4><p class="text-sm text-gray-600 mt-1 leading-relaxed">${content}</p></div>`).join('');
                } else if (agronomyDiv) {
                    agronomyDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }

                if (plantationDiv && estateData.reports.plantation) {
                    plantationDiv.innerHTML = Object.entries(estateData.reports.plantation).map(([section, content]) => `<div class="mb-4"><h4 class="font-semibold text-gray-800">${section}:</h4><p class="text-sm text-gray-600 mt-1 leading-relaxed">${content}</p></div>`).join('');
                } else if (plantationDiv) {
                    plantationDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }

                if (pinfosysDiv && estateData.reports.pinfosys === "Not Available") {
                    pinfosysDiv.innerHTML = `<p class="text-sm text-gray-600">Not Available</p>`;
                }
            }

            function attachEventListeners() {
                container.querySelectorAll('.dropdown-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.currentTarget.dataset.dropdownId;
                        const content = document.getElementById(id);
                        content.classList.toggle('active');
                        event.currentTarget.classList.toggle('active');
                    });
                });
                container.querySelector('.policy-modal-btn')?.addEventListener('click', () => openPolicyModal(estateData));
            }

            renderEstate();
        });
        
        function openPolicyModal(estate) {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            modalTitle.innerText = `Agricultural Policy Cross-Reference: ${estate.name}`;
            modalContent.innerHTML = estate.policy;
            document.getElementById('policyModal').classList.add('active');
        }

        // Global function for the modal close button
        window.closePolicyModal = function() {
            document.getElementById('policyModal').classList.remove('active');
        };
    </script>
</body>
</html>
